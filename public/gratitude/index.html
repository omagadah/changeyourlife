<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <script src="/js/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Gratitude - Change Your Life</title>
  <meta name="description" content="Pratique de la gratitude quotidienne - note chaque jour ce pour quoi tu es reconnaissant et cultive le bien-être au long cours.">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0a0f0a">
  <meta name="msapplication-TileColor" content="#0a0f0a">
  <link rel="stylesheet" href="/css/main.min.css" />
  <link rel="stylesheet" href="/css/transitions.css" />
  <style>
    .content-area { display: flex; flex-direction: column; gap: 22px; }

    /* L'entree du jour : un filet dore, la couleur de la gratitude */
    .entry-card { position: relative; overflow: hidden; }
    .entry-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--gold); }
    .mood-row { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .mood-label { font-size: .8rem; color: var(--text-2); font-weight: 600; flex-shrink: 0; }
    .mood-btns > button { min-width: 44px; padding: 0; font-size: 1.2rem; }
    .mood-btns > button.on { border-color: rgba(231,177,92,.5); background: rgba(231,177,92,.12); }

    .prompt-block { margin-bottom: 16px; }
    .prompt-block:last-of-type { margin-bottom: 0; }
    .prompt-label { font-size: .84rem; font-weight: 600; color: var(--gold-text); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .prompt-num { width: 22px; height: 22px; border-radius: 50%; background: rgba(231,177,92,.18); border: 1px solid rgba(231,177,92,.3); display: inline-flex; align-items: center; justify-content: center; font-size: .7rem; font-weight: 800; color: var(--gold-text); flex-shrink: 0; }
    .prompt-block .textarea { min-height: 64px; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .suggestion-chip { cursor: pointer; font-family: inherit; color: var(--gold-text); border-color: rgba(231,177,92,.25); background: rgba(231,177,92,.06); }
    .suggestion-chip:hover { background: rgba(231,177,92,.14); }
    .btn-save { width: 100%; min-height: 44px; margin-top: 16px; }

    /* Reperes */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .stat-card { text-align: center; padding: 14px 12px; }
    .stat-value { font-size: 1.6rem; line-height: 1.1; color: var(--gold-text); }
    .stat-desc { font-size: .68rem; color: var(--text-3); margin-top: 4px; text-transform: uppercase; letter-spacing: .06em; }

    /* 28 derniers jours */
    .heatmap-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 4px; }
    .heatmap-day-label { font-size: .62rem; text-align: center; color: var(--text-3); font-weight: 700; text-transform: uppercase; }
    .heatmap-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .heatmap-cell { aspect-ratio: 1; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); position: relative; }
    .heatmap-cell[data-has="1"] { background: rgba(231,177,92,.28); border-color: rgba(231,177,92,.4); }
    .heatmap-cell.today { outline: 1.5px solid var(--text-1); outline-offset: 1px; }

    /* Historique */
    .history-list { display: flex; flex-direction: column; gap: 10px; }
    .history-item { border-left: 3px solid rgba(231,177,92,.5); }
    .history-date { font-size: .7rem; color: var(--text-3); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .history-entries { display: flex; flex-direction: column; gap: 6px; }
    .history-entry { font-size: .86rem; color: var(--text-1); line-height: 1.5; display: flex; gap: 8px; align-items: flex-start; }
    .history-entry-num { font-size: .7rem; color: var(--gold-text); font-weight: 700; flex-shrink: 0; margin-top: 2px; }
    .history-mood { font-size: 1rem; }

    @media (max-width: 900px) {
      .stats-grid { gap: 10px; }
    }
    @media (max-width: 640px) {
      .stats-grid { gap: 8px; }
      .stat-value { font-size: 1.3rem; }
      .mood-row { align-items: flex-start; flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <main class="page-shell" aria-labelledby="page-title">
    <header class="page-head">
      <div class="page-head-id">
        <h1 id="page-title"><span class="ic" data-icon="sparkles"></span>Gratitude</h1>
        <p class="page-sub">Trois choses pour lesquelles tu es reconnaissant aujourd'hui.</p>
      </div>
      <div class="page-actions">
        <span class="chip" id="date-badge"><span class="ic" data-icon="calendar" data-icon-size="13"></span>Aujourd'hui</span>
        <span class="chip gold" id="streak-badge" hidden><span class="ic" data-icon="flame" data-icon-size="13"></span><span id="streak-text">0 jour de suite</span></span>
      </div>
    </header>

    <div class="page-body">
      <div class="content-area">

        <!-- L'entree du jour -->
        <section class="card entry-card" id="entry-card" aria-label="Mes gratitudes du jour">
          <div class="mood-row">
            <span class="mood-label" id="mood-label">Ton humeur en ce moment</span>
            <div class="pick mood-btns" id="mood-btns" role="group" aria-labelledby="mood-label">
              <button type="button" class="mood-btn" data-mood="1" aria-label="Difficile" title="Difficile" aria-pressed="false">😔</button>
              <button type="button" class="mood-btn" data-mood="2" aria-label="Bof" title="Bof" aria-pressed="false">😕</button>
              <button type="button" class="mood-btn" data-mood="3" aria-label="Neutre" title="Neutre" aria-pressed="false">😐</button>
              <button type="button" class="mood-btn" data-mood="4" aria-label="Bien" title="Bien" aria-pressed="false">😊</button>
              <button type="button" class="mood-btn" data-mood="5" aria-label="Excellent" title="Excellent" aria-pressed="false">😁</button>
            </div>
          </div>

          <div class="sec-label">Mes trois gratitudes du jour</div>

          <div class="prompt-block">
            <label class="prompt-label" for="g1"><span class="prompt-num" aria-hidden="true">1</span>Je suis reconnaissant pour</label>
            <div class="suggestions" data-for="1">
              <button type="button" class="chip suggestion-chip" data-text="une personne dans ma vie">une personne</button>
              <button type="button" class="chip suggestion-chip" data-text="un moment qui m'a fait sourire">un moment joyeux</button>
              <button type="button" class="chip suggestion-chip" data-text="quelque chose que j'ai accompli">un accomplissement</button>
            </div>
            <textarea class="textarea prompt-input" id="g1" rows="2" placeholder="Écris librement"></textarea>
          </div>

          <div class="prompt-block">
            <label class="prompt-label" for="g2"><span class="prompt-num" aria-hidden="true">2</span>Quelque chose de simple qui a rendu ma journée meilleure</label>
            <div class="suggestions" data-for="2">
              <button type="button" class="chip suggestion-chip" data-text="une bonne conversation">une conversation</button>
              <button type="button" class="chip suggestion-chip" data-text="la nature, la lumière du soleil">la nature</button>
              <button type="button" class="chip suggestion-chip" data-text="un repas ou un moment de repos">un repas</button>
            </div>
            <textarea class="textarea prompt-input" id="g2" rows="2" placeholder="Écris librement"></textarea>
          </div>

          <div class="prompt-block">
            <label class="prompt-label" for="g3"><span class="prompt-num" aria-hidden="true">3</span>Une qualité en moi dont je suis fier aujourd'hui</label>
            <div class="suggestions" data-for="3">
              <button type="button" class="chip suggestion-chip" data-text="ma persévérance face aux obstacles">ma persévérance</button>
              <button type="button" class="chip suggestion-chip" data-text="ma gentillesse envers les autres">ma gentillesse</button>
              <button type="button" class="chip suggestion-chip" data-text="mon courage d'avancer malgré les doutes">mon courage</button>
            </div>
            <textarea class="textarea prompt-input" id="g3" rows="2" placeholder="Écris librement"></textarea>
          </div>

          <button class="btn primary btn-save" type="button" id="btn-save">Enregistrer ma gratitude</button>
        </section>

        <!-- Reperes -->
        <section aria-label="Repères">
          <div class="sec-label">Repères</div>
          <div class="stats-grid">
            <div class="card stat-card">
              <div class="stat-value t-num" id="stat-streak"><span class="sk" style="width:28px;height:22px;margin:0 auto"></span></div>
              <div class="stat-desc">Série actuelle</div>
            </div>
            <div class="card stat-card">
              <div class="stat-value t-num" id="stat-total"><span class="sk" style="width:28px;height:22px;margin:0 auto"></span></div>
              <div class="stat-desc">Jours notés</div>
            </div>
            <div class="card stat-card">
              <div class="stat-value t-num" id="stat-month"><span class="sk" style="width:28px;height:22px;margin:0 auto"></span></div>
              <div class="stat-desc">Ce mois-ci</div>
            </div>
          </div>
        </section>

        <!-- 28 derniers jours -->
        <section aria-label="Mes 28 derniers jours">
          <div class="sec-label">Mes 28 derniers jours</div>
          <div class="heatmap-days" aria-hidden="true">
            <div class="heatmap-day-label">L</div>
            <div class="heatmap-day-label">M</div>
            <div class="heatmap-day-label">M</div>
            <div class="heatmap-day-label">J</div>
            <div class="heatmap-day-label">V</div>
            <div class="heatmap-day-label">S</div>
            <div class="heatmap-day-label">D</div>
          </div>
          <div class="heatmap-grid" id="heatmap"></div>
        </section>

        <!-- Historique -->
        <section aria-label="Historique récent">
          <div class="sec-label">Historique récent</div>
          <div class="history-list" id="history-list">
            <span class="sk" style="height:72px"></span>
          </div>
        </section>

      </div>
    </div>
  </main>

  <script type="module" src="/js/gratitude.js"></script>
</body>
</html>
