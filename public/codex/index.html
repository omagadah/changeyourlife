<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <script src="/js/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Codex - Change Your Life</title>
  <meta name="description" content="Ton Codex de connaissance personnel - capture idées, méthodes, apprentissages et notes pour construire ton savoir au fil du temps.">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0a0f0a">
  <meta name="msapplication-TileColor" content="#0a0f0a">
  <link rel="stylesheet" href="/css/main.min.css"/>
  <link rel="stylesheet" href="/css/transitions.css"/>
  <style>
    /* Deux colonnes : les categories, puis les fiches */
    .cx-grid { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; align-items: start; }
    .cx-aside { position: sticky; top: 0; display: flex; flex-direction: column; gap: 4px; }
    .cx-aside .sec-label { margin: 12px 0 6px; }
    .cx-aside .sec-label:first-child { margin-top: 0; }
    .sb-search { margin-bottom: 10px; position: relative; }
    .sb-search .ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
    .sb-search .input { padding-left: 32px; min-height: 36px; font-size: .86rem; }
    .cat-btn { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 36px; padding: 6px 10px; border-radius: 9px; background: transparent; border: 1px solid transparent; color: var(--text-2); font: inherit; font-size: .86rem; cursor: pointer; text-align: left; transition: background var(--duration), color var(--duration); }
    .cat-btn:hover { background: var(--surface-2); color: var(--text-1); }
    .cat-btn.active { background: rgba(132,194,94,.12); color: var(--leaf-text); }
    .cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .cat-count { margin-left: auto; font-size: .72rem; background: var(--surface-3); padding: 1px 7px; border-radius: 99px; color: var(--text-2); }

    .cx-main-title { font-size: 1.15rem; margin: 0 0 14px; }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
    .cards-list { display: flex; flex-direction: column; gap: 8px; }

    /* Une fiche */
    .ccard { --cc: var(--leaf); background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px 20px; cursor: pointer; position: relative; overflow: hidden; transition: background var(--duration), border-color var(--duration); }
    .ccard::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--cc); }
    .ccard:hover { background: var(--surface-2); border-color: var(--line-strong); }
    .ccard:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }
    .ccard-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .ccard-emoji { font-size: 1.5rem; flex-shrink: 0; line-height: 1; display: inline-flex; align-items: center; color: var(--leaf-text); }
    .ccard-badge { color: var(--cc); border-color: color-mix(in srgb, var(--cc) 35%, transparent); background: transparent; }
    .ccard h3 { font-size: 1rem; margin: 0 0 6px; line-height: 1.35; }
    .ccard p { font-size: .84rem; color: var(--text-2); line-height: 1.55; margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .ccard-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
    .tag { font-size: .72rem; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--line); }
    .tag.mine { color: var(--leaf-text); border-color: rgba(132,194,94,.3); }
    .ccard-list { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 12px; }
    .ccard-list::before { width: 3px; height: auto; bottom: 0; right: auto; }
    .ccard-list .ccard-emoji { font-size: 1.25rem; }
    .ccard-list .cl-body { flex: 1; min-width: 0; }
    .ccard-list h3 { font-size: .94rem; margin-bottom: 2px; }
    .ccard-list p { -webkit-line-clamp: 1; }

    /* Fiche ouverte */
    .modal { position: relative; max-width: 620px; }
    .modal-close { position: absolute; top: 14px; right: 14px; }
    .modal-emoji { font-size: 2.2rem; margin-bottom: 10px; line-height: 1; color: var(--leaf-text); }
    .modal-cat { margin-bottom: 14px; }
    .modal .modal-tagline { font-size: .95rem; color: var(--text-2); margin: 0 0 18px; line-height: 1.6; }
    .modal-body { color: var(--text-1); font-size: .9rem; line-height: 1.75; }
    .modal-body h4 { font-size: .92rem; margin: 18px 0 8px; }
    .modal-body ul { margin: 0 0 0 18px; padding: 0; }
    .modal-body ul li { margin-bottom: 5px; }
    .modal-body p { margin: 0 0 10px; }
    .modal-body blockquote { border-left: 3px solid var(--leaf); padding-left: 14px; color: var(--text-2); font-style: italic; margin: 12px 0; }
    .modal-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
    .modal .field { margin-bottom: 14px; }

    @media (max-width: 900px) {
      .cx-grid { grid-template-columns: 1fr; }
      .cx-aside { position: static; }
      .cx-cats { display: flex; flex-wrap: wrap; gap: 4px; }
      .cx-cats .cat-btn { width: auto; }
    }
    @media (max-width: 640px) {
      .cards-grid { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ccard, .cat-btn { transition: none; }
    }
  </style>
</head>
<body>
<main class="page-shell" aria-labelledby="page-title">
  <header class="page-head">
    <div class="page-head-id">
      <h1 id="page-title"><span class="ic" data-icon="library"></span>Codex</h1>
      <p class="page-sub" id="main-sub">Concepts, méthodes et repères pour avancer, et tes propres notes.</p>
    </div>
    <div class="page-actions">
      <div class="seg" role="group" aria-label="Affichage">
        <button type="button" class="vt-btn active" id="vt-grid" data-view="grid" aria-pressed="true"><span class="ic" data-icon="grid" data-icon-size="14"></span>Grille</button>
        <button type="button" class="vt-btn" id="vt-list" data-view="list" aria-pressed="false"><span class="ic" data-icon="sort" data-icon-size="14"></span>Liste</button>
      </div>
      <button class="btn primary" type="button" id="btn-add-note"><span class="ic" data-icon="plus"></span>Ajouter une note</button>
    </div>
  </header>

  <div class="page-body">
    <div class="cx-grid">
      <aside class="cx-aside" aria-label="Catégories">
        <div class="sb-search">
          <span class="ic" data-icon="search" data-icon-size="15"></span>
          <input class="input" type="search" id="search-input" placeholder="Rechercher" aria-label="Rechercher dans le Codex">
        </div>
        <div class="sec-label">Catégories</div>
        <div class="cx-cats">
          <button type="button" class="cat-btn active" data-cat="all" aria-pressed="true">
            <span class="cat-dot" style="background:var(--leaf)"></span> Tout voir
            <span class="cat-count" id="cnt-all">0</span>
          </button>
          <button type="button" class="cat-btn" data-cat="corps" aria-pressed="false">
            <span class="cat-dot" style="background:var(--corps)"></span> Corps
            <span class="cat-count" id="cnt-corps">0</span>
          </button>
          <button type="button" class="cat-btn" data-cat="coeur" aria-pressed="false">
            <span class="cat-dot" style="background:var(--coeur)"></span> Cœur
            <span class="cat-count" id="cnt-coeur">0</span>
          </button>
          <button type="button" class="cat-btn" data-cat="etre" aria-pressed="false">
            <span class="cat-dot" style="background:var(--etre)"></span> Être
            <span class="cat-count" id="cnt-etre">0</span>
          </button>
          <button type="button" class="cat-btn" data-cat="ordre" aria-pressed="false">
            <span class="cat-dot" style="background:var(--ordre)"></span> Ordre
            <span class="cat-count" id="cnt-ordre">0</span>
          </button>
        </div>
        <div class="sec-label">Mes notes</div>
        <div class="cx-cats">
          <button type="button" class="cat-btn" data-cat="user" aria-pressed="false">
            <span class="cat-dot" style="background:var(--leaf-text)"></span> Mes ajouts
            <span class="cat-count" id="cnt-user">0</span>
          </button>
        </div>
      </aside>

      <section class="cx-main" aria-labelledby="main-title">
        <h2 class="cx-main-title" id="main-title">Tout le Codex</h2>
        <div class="cards-grid" id="cards-container"></div>
      </section>
    </div>
  </div>
</main>

<!-- Fiche ouverte -->
<div class="modal-veil" id="concept-modal" role="dialog" aria-modal="true" aria-label="Fiche">
  <div class="modal">
    <button class="btn quiet sm modal-close" type="button" data-action="close-concept" aria-label="Fermer"><span class="ic" data-icon="x"></span></button>
    <div id="modal-content"></div>
  </div>
</div>

<!-- Ajouter une note -->
<div class="modal-veil" id="add-modal" role="dialog" aria-modal="true" aria-labelledby="add-title">
  <div class="modal">
    <button class="btn quiet sm modal-close" type="button" data-action="close-add" aria-label="Fermer"><span class="ic" data-icon="x"></span></button>
    <h2 id="add-title" style="margin-bottom:16px">Ajouter une note</h2>
    <div class="field">
      <label for="note-title">Titre</label>
      <input class="input" type="text" id="note-title" placeholder="Nom du concept ou de la méthode" required>
    </div>
    <div class="field">
      <label for="note-cat">Catégorie</label>
      <select class="select" id="note-cat">
        <option value="corps">Corps</option>
        <option value="coeur">Cœur</option>
        <option value="etre">Être</option>
        <option value="ordre">Ordre</option>
      </select>
    </div>
    <div class="field">
      <label for="note-summary">Résumé</label>
      <textarea class="textarea" id="note-summary" placeholder="Décris le concept en quelques phrases" required></textarea>
    </div>
    <div class="field">
      <label for="note-body">Contenu détaillé (facultatif)</label>
      <textarea class="textarea" id="note-body" placeholder="Notes, étapes, exemples" style="min-height:120px"></textarea>
    </div>
    <div class="field">
      <label for="note-tags">Tags, séparés par des virgules</label>
      <input class="input" type="text" id="note-tags" placeholder="habitude, productivité, santé">
    </div>
    <div class="modal-actions">
      <button class="btn quiet" type="button" data-action="close-add">Annuler</button>
      <button class="btn primary" type="button" data-action="save-note">Enregistrer</button>
    </div>
  </div>
</div>

<script type="module" src="/js/codex.js"></script>
</body>
</html>
