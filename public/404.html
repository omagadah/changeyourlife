<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <script src="/js/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Page introuvable - Change Your Life</title>
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0a0f0a">
  <link rel="stylesheet" href="/css/main.min.css"/>
  <link rel="stylesheet" href="/css/transitions.css"/>
  <style>
    /* Page sans script : pas d'icône hydratée, le chiffre fait l'image. */
    .page-head { max-width:70ch; margin-left:auto; margin-right:auto; }
    .lost { max-width:70ch; margin:0 auto; }
    .code { font-family:var(--font-display); font-variation-settings:"opsz" 144; font-size:clamp(4rem, 12vw, 7rem); font-weight:500; line-height:1; letter-spacing:-.03em; color:var(--leaf-text); margin:10px 0 14px; }
    .lost p { color:var(--text-2); font-size:1rem; line-height:1.6; margin:0 0 24px; max-width:48ch; }
    .row { display:flex; gap:10px; flex-wrap:wrap; }
  </style>
</head>
<body>
  <main class="page-shell scroll" aria-labelledby="page-title">
    <header class="page-head">
      <div class="page-head-id">
        <span class="t-eyebrow">Erreur 404</span>
        <h1 id="page-title">Page introuvable</h1>
      </div>
    </header>
    <div class="lost">
      <div class="code" aria-hidden="true">404</div>
      <p>La page que tu cherches a été déplacée, supprimée, ou n'a jamais existé. Rien de grave : ton arbre est toujours là.</p>
      <div class="row">
        <a class="btn primary" href="/">Retour à l'accueil</a>
        <a class="btn" href="/login/">Connexion</a>
      </div>
    </div>
  </main>
</body>
</html>
