<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <script src="/js/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Humeur - Change Your Life</title>
  <meta name="description" content="Suivi d'humeur quotidien - note comment tu te sens au fil des jours et repère ce qui joue sur ton bien-être.">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0a0f0a">
  <meta name="msapplication-TileColor" content="#0a0f0a">
  <link rel="stylesheet" href="/css/main.min.css" />
  <link rel="stylesheet" href="/css/transitions.css" />
  <style>
    /* L'echelle d'humeur, la meme que l'annee en pixels (.px[data-v]) */
    .page-shell { --m1:#b3312c; --m2:#d97b3a; --m3:#c9a227; --m4:#6f9a52; --m5:#44bd48; }
    .content-area { display: flex; flex-direction: column; gap: 22px; }

    /* L'humeur du jour */
    .today-mood-card { position: relative; overflow: hidden; }
    .today-mood-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--mood-accent, var(--line-strong)); transition: background .4s; }
    .mood-question { font-size: 1rem; margin: 0 0 14px; }
    .mood-row { justify-content: center; margin-bottom: 16px; }
    .mood-row > button { width: 64px; padding: 8px 4px 7px; }
    .mood-row > button.on { border-color: var(--mbcolor, var(--line-strong)); background: color-mix(in srgb, var(--mbcolor, var(--text-3)) 14%, transparent); }
    .mood-emoji { font-size: 1.7rem; line-height: 1; }
    .mood-row > button.on small { color: var(--text-1); }
    .mood-row[aria-disabled="true"] { opacity: .55; pointer-events: none; }
    .mood-note-wrap { margin-bottom: 12px; }
    .domain-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .domain-row[aria-disabled="true"] { opacity: .55; pointer-events: none; }
    .domain-pill { cursor: pointer; font-family: inherit; min-height: 32px; }
    .domain-pill.on { color: var(--dpcolor); border-color: var(--dpcolor); background: color-mix(in srgb, var(--dpcolor) 14%, transparent); }
    .save-mood-btn { width: 100%; min-height: 44px; }

    /* Reperes */
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .stat-block { text-align: center; padding: 14px 12px; border-bottom: 2px solid var(--sb-color, var(--line)); }
    .stat-block-value { font-size: 1.6rem; line-height: 1.1; }
    .stat-block-label { font-size: .68rem; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; }

    /* 30 derniers jours */
    .heatmap-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .heatmap-legend { display: inline-flex; align-items: center; gap: 4px; font-size: .68rem; color: var(--text-3); }
    .legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
    .heatmap-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin-top: 12px; }
    .heatmap-cell { aspect-ratio: 1; border-radius: 5px; background: var(--surface-2); position: relative; }
    .heatmap-cell[data-mood="1"] { background: var(--m1); }
    .heatmap-cell[data-mood="2"] { background: var(--m2); }
    .heatmap-cell[data-mood="3"] { background: var(--m3); }
    .heatmap-cell[data-mood="4"] { background: var(--m4); }
    .heatmap-cell[data-mood="5"] { background: var(--m5); }
    .heatmap-cell .cell-tooltip { display: none; position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: var(--sheet-bg); border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 8px; font-size: .7rem; color: var(--text-1); white-space: nowrap; z-index: 10; pointer-events: none; }
    .heatmap-cell:hover .cell-tooltip, .heatmap-cell:focus-visible .cell-tooltip { display: block; }
    .pixels-note { font-size: .72rem; color: var(--text-3); }
    .px.vide { visibility: hidden; }

    /* Historique */
    .entries-list { display: flex; flex-direction: column; gap: 8px; }
    .entry-row { display: flex; align-items: center; gap: 12px; background: var(--surface-1); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; position: relative; overflow: hidden; }
    .entry-row::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--entry-mood-color, var(--line-strong)); }
    .entry-emoji { font-size: 1.4rem; flex-shrink: 0; }
    .entry-meta { flex: 1; min-width: 0; }
    .entry-date { font-size: .72rem; color: var(--text-3); font-weight: 600; margin-bottom: 2px; }
    .entry-note { font-size: .84rem; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .entry-note em { color: var(--text-3); }
    .entry-domain { color: var(--dpcolor, var(--text-2)); border-color: color-mix(in srgb, var(--dpcolor, var(--text-3)) 30%, transparent); }

    @media (max-width: 900px) {
      .heatmap-grid { grid-template-columns: repeat(10, 1fr); }
    }
    @media (max-width: 640px) {
      .heatmap-grid { grid-template-columns: repeat(6, 1fr); }
      .stats-row { gap: 8px; }
      .mood-row > button { width: 56px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .today-mood-card::before { transition: none; }
    }
  </style>
</head>
<body>
  <main class="page-shell" aria-labelledby="page-title">
    <header class="page-head">
      <div class="page-head-id">
        <h1 id="page-title"><span class="ic" data-icon="smile"></span>Humeur</h1>
        <p class="page-sub">Comment tu te sens, jour après jour. Pas de note, juste une trace.</p>
      </div>
      <div class="page-actions">
        <span class="chip gold" id="streak-badge" style="display:none"><span class="ic" data-icon="flame" data-icon-size="13"></span><span id="streak-count">0</span>&nbsp;jour(s) de suite</span>
      </div>
    </header>

    <div class="page-body">
      <div class="content-area">

        <!-- L'humeur du jour -->
        <section class="card today-mood-card" id="today-mood-card" aria-labelledby="mood-question">
          <h2 class="mood-question" id="mood-question">Comment tu te sens aujourd'hui ?</h2>
          <div class="pick mood-row" id="mood-row" role="group" aria-label="Choisir ton humeur">
            <button type="button" class="mood-btn" data-mood="1" style="--mbcolor:var(--m1)" aria-pressed="false"><span class="mood-emoji" aria-hidden="true">😞</span><small>Difficile</small></button>
            <button type="button" class="mood-btn" data-mood="2" style="--mbcolor:var(--m2)" aria-pressed="false"><span class="mood-emoji" aria-hidden="true">😟</span><small>Bas</small></button>
            <button type="button" class="mood-btn" data-mood="3" style="--mbcolor:var(--m3)" aria-pressed="false"><span class="mood-emoji" aria-hidden="true">😐</span><small>Neutre</small></button>
            <button type="button" class="mood-btn" data-mood="4" style="--mbcolor:var(--m4)" aria-pressed="false"><span class="mood-emoji" aria-hidden="true">🙂</span><small>Bien</small></button>
            <button type="button" class="mood-btn" data-mood="5" style="--mbcolor:var(--m5)" aria-pressed="false"><span class="mood-emoji" aria-hidden="true">😄</span><small>Excellent</small></button>
          </div>

          <div class="field mood-note-wrap">
            <label for="mood-note">Une note sur ton état d'esprit (facultatif)</label>
            <textarea class="textarea" id="mood-note" rows="2" placeholder="Ce qui a compté aujourd'hui" style="min-height:64px"></textarea>
          </div>

          <div class="domain-row" id="domain-row" role="group" aria-label="Domaine concerné (facultatif)">
            <button type="button" class="chip domain-pill" data-domain="corps" style="--dpcolor:var(--corps)" aria-pressed="false">Corps</button>
            <button type="button" class="chip domain-pill" data-domain="coeur" style="--dpcolor:var(--coeur)" aria-pressed="false">Cœur</button>
            <button type="button" class="chip domain-pill" data-domain="etre" style="--dpcolor:var(--etre)" aria-pressed="false">Être</button>
            <button type="button" class="chip domain-pill" data-domain="ordre" style="--dpcolor:var(--ordre)" aria-pressed="false">Ordre</button>
          </div>

          <button class="btn primary save-mood-btn" type="button" id="save-mood-btn" disabled>Enregistrer mon humeur</button>
        </section>

        <!-- Reperes -->
        <section aria-label="Repères">
          <div class="sec-label">Repères</div>
          <div class="stats-row">
            <div class="card stat-block" style="--sb-color:var(--gold)">
              <div class="stat-block-value t-num" id="stat-streak">0</div>
              <div class="stat-block-label">Jours de suite</div>
            </div>
            <div class="card stat-block" id="stat-avg-block" style="--sb-color:var(--leaf)" hidden>
              <div class="stat-block-value t-num" id="stat-avg"></div>
              <div class="stat-block-label">Moyenne sur 7 jours</div>
            </div>
            <div class="card stat-block" style="--sb-color:var(--moss)">
              <div class="stat-block-value t-num" id="stat-total">0</div>
              <div class="stat-block-label">Jours notés</div>
            </div>
          </div>
        </section>

        <!-- 30 derniers jours -->
        <section class="card" aria-label="30 derniers jours">
          <div class="heatmap-head">
            <div class="sec-label" style="margin:0;flex:1">30 derniers jours</div>
            <span class="heatmap-legend" aria-hidden="true">
              <span>Difficile</span>
              <span class="legend-dot" style="background:var(--m1)"></span>
              <span class="legend-dot" style="background:var(--m2)"></span>
              <span class="legend-dot" style="background:var(--m3)"></span>
              <span class="legend-dot" style="background:var(--m4)"></span>
              <span class="legend-dot" style="background:var(--m5)"></span>
              <span>Excellent</span>
            </span>
          </div>
          <div class="heatmap-grid" id="heatmap-grid"></div>
        </section>

        <!-- L'annee en pixels : un carre par jour sur 365 jours -->
        <section class="card" aria-label="Ton année en pixels">
          <div class="heatmap-head" style="margin-bottom:12px">
            <div class="sec-label" style="margin:0;flex:1">Ton année en pixels</div>
            <span class="pixels-note" id="pixels-note"></span>
          </div>
          <div class="pixels" id="pixels-grid" aria-label="Humeur de chaque jour des 365 derniers jours"></div>
        </section>

        <!-- Historique -->
        <section aria-label="Historique récent">
          <div class="sec-label">Historique récent</div>
          <div class="entries-list" id="entries-list">
            <span class="sk" style="height:52px"></span>
            <span class="sk" style="height:52px"></span>
          </div>
        </section>

      </div>
    </div>
  </main>

  <script type="module" src="/js/humeur.js"></script>
</body>
</html>
