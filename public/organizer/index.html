<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <script src="/js/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ORGANIZER - Change Your Life</title>
  <meta name="description" content="ORGANIZER : déverse toutes tes idées, trie-les par priorité (matrice d'Eisenhower), planifie, et vois-toi accomplir - chaque fiche terminée fait grandir ton arbre.">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0a0f0a">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/main.min.css"/>
  <link rel="stylesheet" href="/css/transitions.css"/>
  <style>
    /* ORGANIZER : le board et la toile remplissent le cadre, ils ne défilent
       pas avec la page. Le corps devient donc une colonne flex sans défilement. */
    .page-body { display:flex; flex-direction:column; overflow:hidden; padding-bottom:4px; }
    .org-lock.locked { background:rgba(231,177,92,.14); border-color:rgba(231,177,92,.45); color:var(--gold-text); }

    /* ── Scène (contient les 2 vues) ── */
    .org-stage { position:relative; flex:1; min-height:0; overflow:hidden; }
    .org-wrap { display:flex; gap:0; overflow-x:auto; overflow-y:hidden; height:100%; padding-bottom:8px; align-items:stretch; }
    .org-wrap[hidden], .org-canvas-wrap[hidden] { display:none; }
    .org-board { display:flex; gap:14px; align-items:stretch; height:100%; }
    .org-sep { flex:0 0 1px; align-self:stretch; margin:6px 14px; width:1px; background:var(--line-strong); }
    .org-col { flex:0 0 290px; display:flex; flex-direction:column; max-height:100%; border-radius:var(--r-lg);
      background:var(--surface-1); border:1px solid var(--line); }
    /* Colonne « Idées à trier » : figée à gauche, mise en avant */
    .org-tri { flex:0 0 296px; display:flex; flex-direction:column; max-height:100%; border-radius:var(--r-lg);
      background:var(--surface-2); border:1px solid var(--line-strong); }

    /* ── Le geste de déplacement ──
       La colonne visée s'allume, et elle seule (markOrgTarget dans organizer.js). */
    .org-col.drag-over, .org-tri.drag-over { border-color:rgba(132,194,94,.6); background:rgba(132,194,94,.07); }
    /* L'ENCOCHE : l'emplacement exact où la fiche va tomber. Un creux en
       pointillés, contenu masqué. NEUTRE POUR LA MISE EN PAGE : organizer.js
       pose un border-left:3px en inline (couleur de branche) ; on le garde. */
    .org-slot { opacity:1 !important; background:rgba(132,194,94,.09) !important;
      border:1px dashed rgba(132,194,94,.75) !important;
      border-left:3px dashed rgba(132,194,94,.75) !important; box-shadow:none !important; }
    .org-slot > * { visibility:hidden; }
    /* La fiche pendant qu'on la tire : fond opaque pour le cliché du navigateur. */
    .org-drag { cursor:grabbing; opacity:1 !important; background:var(--bg-elevated) !important; border-color:rgba(132,194,94,.85) !important; }
    .org-chosen { cursor:grabbing; }
    .org-col-ghost { opacity:.4; }
    body.org-dragging .org-card:hover { background:var(--surface-1); }
    @keyframes orgLanded { 0% { box-shadow:0 0 0 0 rgba(132,194,94,.55); } 100% { box-shadow:0 0 0 12px rgba(132,194,94,0); } }
    .org-landed { animation:orgLanded .9s cubic-bezier(.22,.8,.3,1) both; }
    /* Arrivée depuis le mini-module de l'accueil : la colonne visée se signale. */
    .org-col-landed { animation:orgLand 1.6s ease-out; }
    @keyframes orgLand {
      0%   { box-shadow:0 0 0 2px rgba(231,177,92,.9); }
      70%  { box-shadow:0 0 0 2px rgba(231,177,92,.55); }
      100% { box-shadow:none; }
    }

    .org-col-head { display:flex; align-items:center; gap:8px; padding:13px 14px 10px; }
    .org-col-dot { width:9px; height:9px; border-radius:50%; background:var(--cc, var(--text-3)); flex-shrink:0; }
    .org-col-title { flex:1; font-size:.84rem; font-weight:700; color:var(--text-1); line-height:1.25; cursor:text; }
    .org-col-count { font-size:.72rem; font-weight:700; color:var(--text-3); background:var(--surface-3); padding:1px 8px; border-radius:99px; }
    .org-col-menu { border:none; background:none; color:var(--text-3); cursor:pointer; font-size:1rem; padding:0 6px; min-height:28px; border-radius:6px; }
    .org-col-menu:hover { color:var(--text-1); background:var(--surface-3); }
    .org-cards { flex:1; overflow-y:auto; padding:4px 10px; display:flex; flex-direction:column; gap:8px; min-height:24px; }
    .org-add { margin:8px 10px 12px; min-height:40px; padding:9px 12px; border-radius:var(--r-sm); border:1px dashed var(--line-strong); background:transparent; color:var(--text-3); font:inherit; font-size:.82rem; cursor:pointer; text-align:left; }
    .org-add:hover { background:var(--surface-2); color:var(--text-1); }
    .org-add-input { margin:6px 10px 12px; }
    .org-add-input textarea { width:100%; resize:vertical; min-height:54px; border-radius:var(--r-sm); border:1px solid var(--line-strong); background:var(--field-bg); color:var(--text-1); font:inherit; font-size:.85rem; padding:9px 11px; }
    .org-add-input textarea:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-glow); }
    .org-add-row { display:flex; gap:8px; margin-top:6px; }

    /* ── Card ── */
    .org-card { background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-sm); padding:11px 12px; cursor:grab;
      position:relative; transition:background var(--duration), border-color var(--duration); }
    .org-card:hover { background:var(--surface-3); border-color:var(--line-strong); }
    .org-card:active { cursor:grabbing; }
    .org-card.dragging { opacity:.45; }
    .org-card.done .org-card-title { text-decoration:line-through; opacity:.7; }
    .org-card-title { font-size:.88rem; color:var(--text-1); line-height:1.4; white-space:pre-wrap; word-break:break-word; }
    .org-card-badges { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
    .org-badge { display:inline-flex; align-items:center; gap:4px; font-size:.7rem; font-weight:600; padding:2px 7px; border-radius:99px; background:var(--surface-3); color:var(--text-2); }
    .org-badge.due-soon { background:rgba(251,191,36,.15); color:var(--gold-text); }
    .org-badge.due-late { background:rgba(239,68,68,.16); color:var(--red); }
    /* L'âge de la fiche : discret, puis coloré passé un mois sans bouger. */
    .org-badge.age { background:transparent; color:var(--text-3); padding-left:0; }
    .org-badge.age.old { background:rgba(231,177,92,.13); color:var(--gold-text); padding-left:7px; }
    .org-badge.done-at { background:rgba(132,194,94,.14); color:var(--leaf-text); }

    /* ── Fiche détaillée (modale) ── */
    .org-modal { position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px; background:var(--veil); }
    .org-modal.hidden { display:none; }
    .org-card-detail { width:100%; max-width:540px; max-height:90vh; overflow-y:auto; background:var(--sheet-bg); border:1px solid var(--line-strong);
      border-radius:var(--r-lg); padding:22px; box-shadow:var(--shadow-lg); }
    .org-d-title { width:100%; font-family:var(--font-display); font-size:1.15rem; font-weight:600; color:var(--text-1); background:var(--field-bg); border:1px solid var(--line-strong);
      border-radius:var(--r-sm); padding:10px 12px; resize:vertical; min-height:44px; }
    .org-d-title:focus, .org-d-input:focus, .org-d-move:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-glow); }
    .org-d-label { font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.09em; color:var(--text-3); margin:18px 0 8px; }
    .org-d-input { width:100%; border-radius:var(--r-sm); border:1px solid var(--line-strong); background:var(--field-bg); color:var(--text-1); font:inherit; font-size:.9rem; padding:9px 11px; }
    textarea.org-d-input { resize:vertical; min-height:70px; }
    /* Rattachement d'une fiche à une branche Maslow (elle nourrit cette part de vie) */
    .org-d-branches { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
    .org-d-br { display:flex; flex-direction:column; align-items:center; gap:4px; min-height:44px; padding:9px 4px; border-radius:var(--r-sm); cursor:pointer;
      border:1px solid var(--line); background:var(--surface-1); color:var(--text-2); font:inherit; transition:background var(--duration), border-color var(--duration); }
    .org-d-br svg { width:18px; height:18px; color:var(--bc, var(--text-2)); }
    .org-d-br span { font-size:.62rem; font-weight:600; text-align:center; line-height:1.1; }
    .org-d-br:hover { background:var(--surface-2); }
    .org-d-br.on, .org-d-br[aria-pressed="true"] { border-color:var(--bc); background:color-mix(in srgb, var(--bc) 18%, transparent); color:var(--text-1); }
    .org-check { display:flex; align-items:center; gap:9px; padding:5px 0; }
    .org-check input[type=checkbox] { width:18px; height:18px; accent-color:var(--leaf); cursor:pointer; flex-shrink:0; }
    .org-check span { flex:1; font-size:.88rem; color:var(--text-1); }
    .org-check span.done { text-decoration:line-through; color:var(--text-3); }
    .org-check .del { cursor:pointer; color:var(--text-3); border:none; background:none; min-width:32px; min-height:32px; display:inline-grid; place-items:center; border-radius:6px; }
    .org-check .del:hover { color:var(--red); background:var(--surface-2); }
    .org-prog { height:4px; background:var(--surface-3); border-radius:4px; overflow:hidden; margin:4px 0 8px; }
    .org-prog div { height:100%; background:var(--leaf); border-radius:4px; transition:width .4s; }
    .org-logs { display:flex; flex-direction:column; gap:5px; max-height:230px; overflow-y:auto; }
    .org-log { font-size:.78rem; color:var(--text-2); display:flex; gap:8px; }
    .org-log .t { color:var(--text-3); white-space:nowrap; flex-shrink:0; }
    /* Un commentaire se distingue d'une trace système : encadré, supprimable. */
    .org-log.com { align-items:flex-start; padding:7px 9px; border-radius:9px; background:var(--surface-2); border:1px solid var(--line); color:var(--text-1); }
    .org-log-txt { flex:1; white-space:pre-wrap; word-break:break-word; }
    .org-log-del { border:none; background:none; cursor:pointer; color:var(--text-3); min-width:28px; min-height:28px; display:inline-grid; place-items:center; border-radius:6px; flex-shrink:0; }
    .org-log-del:hover { color:var(--red); background:var(--surface-3); }
    .org-comment-new { display:flex; flex-direction:column; gap:7px; margin-bottom:12px; }
    .org-comment-new .btn { align-self:flex-start; }
    /* Bandeau de dates sous le titre de la fiche. */
    .org-d-meta { display:flex; flex-wrap:wrap; align-items:center; gap:7px; font-size:.74rem; color:var(--text-3); margin:6px 0 4px; }
    .org-d-meta b { color:var(--text-2); font-weight:600; }
    .org-d-meta i { color:var(--text-3); font-style:normal; }
    .org-d-actions { display:flex; gap:10px; margin-top:22px; flex-wrap:wrap; }
    .org-d-actions .del { margin-left:auto; }
    .org-d-move { width:100%; border-radius:var(--r-sm); border:1px solid var(--line-strong); background:var(--field-bg); color:var(--text-1); font:inherit; font-size:.85rem; padding:9px 11px; }

    /* ── Vue Canvas (toile infinie, workflow) ── */
    .org-canvas-wrap { position:absolute; inset:0; overflow:hidden; border-radius:var(--r); cursor:grab; touch-action:none;
      background-color:var(--surface-1);
      background-image:radial-gradient(circle, var(--line-strong) 1.2px, transparent 1.2px);
      background-size:24px 24px; }
    .org-canvas-wrap.panning { cursor:grabbing; }
    .org-canvas-world { position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; }
    .org-node { position:absolute; width:210px; box-sizing:border-box; background:var(--bg-elevated);
      border:1px solid var(--line); border-left:3px solid var(--nc, var(--text-3)); border-radius:var(--r-sm);
      padding:11px 13px; cursor:grab; box-shadow:var(--shadow-sm); transition:border-color var(--duration); user-select:none; }
    .org-node:hover { border-color:var(--nc, var(--line-strong)); }
    .org-node.done { opacity:.68; }
    .org-node.done .org-node-title { text-decoration:line-through; }
    .org-node-col { display:inline-flex; align-items:center; gap:5px; font-size:.64rem; font-weight:700;
      text-transform:uppercase; letter-spacing:.05em; color:var(--nc, var(--text-3)); margin-bottom:5px; }
    .org-node-col i { width:7px; height:7px; border-radius:50%; background:var(--nc, var(--text-3)); }
    .org-node-title { font-size:.86rem; color:var(--text-1); line-height:1.38; word-break:break-word; }
    .org-node-badges { display:flex; gap:5px; flex-wrap:wrap; margin-top:8px; }
    .org-canvas-toolbar { position:absolute; top:12px; right:12px; z-index:5; display:flex; gap:8px; }
    .org-canvas-toolbar .btn { background:var(--bg-surface); }
    .org-canvas-hint { position:absolute; bottom:10px; left:14px; right:14px; font-size:.74rem; color:var(--text-3); pointer-events:none; user-select:none; }

    /* ── Connecteurs (flèches entre fiches) ── */
    .org-links { position:absolute; left:0; top:0; overflow:visible; pointer-events:none; }
    .org-link { fill:none; stroke:var(--text-3); stroke-width:2.2; opacity:.7; }
    .org-link-hit { fill:none; stroke:transparent; stroke-width:16; pointer-events:stroke; cursor:pointer; }
    .org-link-g:hover .org-link { stroke:var(--leaf); opacity:1; }
    .org-link.temp { stroke:var(--leaf); stroke-dasharray:6 6; }
    .org-node-port { position:absolute; right:-7px; top:50%; transform:translateY(-50%); width:15px; height:15px;
      border-radius:50%; background:var(--nc, var(--text-3)); border:2px solid var(--bg-surface); cursor:crosshair;
      opacity:0; transition:opacity var(--duration); z-index:2; }
    .org-node:hover .org-node-port, .org-canvas-wrap.linking .org-node-port { opacity:1; }
    .org-canvas-wrap.linking .org-node { cursor:crosshair; }

    @media (max-width:640px) {
      .org-col, .org-tri { flex-basis:80vw; }
      .org-d-branches { grid-template-columns:repeat(2, 1fr); }
    }
    @media (prefers-reduced-motion: reduce) {
      .org-landed, .org-col-landed { animation:none; }
    }
  </style>
</head>
<body>
  <main class="page-shell" aria-labelledby="page-title">
    <header class="page-head">
      <div class="page-head-id">
        <h1 id="page-title"><span class="ic" data-icon="inbox"></span>ORGANIZER</h1>
        <p class="page-sub">Déverse toutes tes idées, trie-les par priorité, planifie : chaque fiche terminée fait grandir ton arbre.</p>
      </div>
      <div class="page-actions">
        <div class="seg" id="org-viewtoggle" role="tablist" aria-label="Vue">
          <button type="button" data-view="board" class="active" role="tab" aria-selected="true"><span class="ic" data-icon="grid"></span>Board</button>
          <button type="button" data-view="canvas" role="tab" aria-selected="false"><span class="ic" data-icon="compass"></span>Canvas</button>
        </div>
        <button type="button" class="btn sm org-lock" id="org-lock-cols" title="Verrouiller les colonnes" aria-pressed="false">
          <span class="org-lock-ic ic" aria-hidden="true"></span>Colonnes
        </button>
        <button type="button" class="btn sm org-lock" id="org-lock-cards" title="Verrouiller les fiches" aria-pressed="false">
          <span class="org-lock-ic ic" aria-hidden="true"></span>Fiches
        </button>
        <button type="button" class="btn sm" id="org-add-col"><span class="ic" data-icon="plus"></span>Colonne</button>
      </div>
    </header>

    <div class="page-body">
      <div class="org-stage" id="org-stage">
        <div class="org-wrap full" id="org-wrap">
          <div class="org-tri" id="org-tri"></div>
          <div class="org-sep" aria-hidden="true"></div>
          <div class="org-board" id="org-board"></div>
        </div>
        <div class="org-canvas-wrap" id="org-canvas-wrap" hidden>
          <div class="org-canvas-toolbar">
            <button type="button" class="btn sm" id="org-canvas-reorg" title="Aligner les fiches par colonne"><span class="ic" data-icon="sort"></span>Réorganiser</button>
            <button type="button" class="btn sm" id="org-canvas-fit" title="Recentrer la vue"><span class="ic" data-icon="minimize"></span>Recentrer</button>
          </div>
          <div class="org-canvas-world" id="org-canvas-world"></div>
          <div class="org-canvas-hint">Glisse le fond pour te déplacer · molette pour zoomer · glisse une fiche pour la ranger · tire le point d'une fiche pour la relier · clic sur un lien pour l'effacer</div>
        </div>
      </div>
    </div>
  </main>

  <div class="org-modal hidden" id="org-modal"></div>

  <script src="/vendor/sortable/Sortable.min.js"></script>
  <script type="module" src="/js/organizer.js"></script>
</body>
</html>
