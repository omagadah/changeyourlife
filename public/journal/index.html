<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <script src="/js/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Journal - Change Your Life</title>
  <meta name="description" content="Ton journal de bord personnel - réflexions quotidiennes, émotions et repères pour mieux te connaître." />
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0a0f0a">
  <meta name="msapplication-TileColor" content="#0a0f0a">
  <link rel="stylesheet" href="/css/main.min.css" />
  <link rel="stylesheet" href="/css/transitions.css" />
  <style>
    /* Deux colonnes : la liste des entrées, puis la lecture ou l'écriture. */
    .jr-grid { height: 100%; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; }
    .jr-col { min-height: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface-1); overflow: hidden; }
    .jr-col-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
    .jr-col-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px; }
    .jr-col-body.column { display: flex; flex-direction: column; }

    /* Compteur et repères en tête de liste */
    .jr-count { font-size: .82rem; color: var(--text-2); }
    .jr-stats { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .jr-stats:empty { display: none; }

    /* Recherche */
    .jr-search { margin-top: 10px; position: relative; }
    .jr-search .input { padding-right: 36px; min-height: 36px; font-size: .86rem; }
    .jr-search .search-clear { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border: none; background: transparent; color: var(--text-2); cursor: pointer; display: none; align-items: center; justify-content: center; border-radius: 8px; }
    .jr-search .search-clear:hover { color: var(--text-1); background: var(--surface-2); }

    /* Filtres : des pastilles cliquables */
    .filter-section-label { font-size: .68rem; color: var(--text-3); text-transform: uppercase; letter-spacing: .09em; margin: 10px 0 4px; font-weight: 700; }
    .filter-pills { display: flex; gap: 4px; flex-wrap: wrap; }
    .filter-pill { cursor: pointer; font-family: inherit; min-height: 30px; }
    .filter-pill.clear-btn { color: var(--red); }
    .jr-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; }

    /* Humeur sur 7 jours */
    .mood-chart-wrap { margin-top: 10px; }
    .mood-chart { display: flex; gap: 5px; align-items: flex-end; height: 44px; padding: 0 2px; }
    .mood-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .mood-bar-bg { width: 14px; background: var(--surface-2); border-radius: 4px; overflow: hidden; height: 32px; display: flex; align-items: flex-end; }
    .mood-bar-fill { width: 100%; background: var(--leaf); border-radius: 4px; }
    .mood-bar-label { font-size: .7rem; color: var(--text-3); }

    /* Une entrée dans la liste */
    .entry-item { width: 100%; text-align: left; font: inherit; padding: 10px 12px 10px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-1); color: var(--text-1); cursor: pointer; margin-bottom: 6px; position: relative; overflow: hidden; transition: background var(--duration), border-color var(--duration); }
    .entry-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--entry-color, var(--line-strong)); opacity: .6; }
    .entry-item:hover { background: var(--surface-2); border-color: var(--line-strong); }
    .entry-item.active { background: rgba(132,194,94,.09); border-color: rgba(132,194,94,.3); }
    .entry-item.active::before { opacity: 1; }
    .entry-item-row { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; }
    .entry-emoji { font-size: 1.05rem; }
    .entry-date { font-size: .74rem; color: var(--text-2); flex: 1; }
    .entry-word-badge { font-size: .68rem; font-weight: 600; color: var(--text-3); padding: 1px 6px; border-radius: 6px; background: var(--surface-2); }
    .entry-title { display: block; font-size: .86rem; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .entry-preview { display: block; font-size: .8rem; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* L'état vide du panneau principal est centré dans sa colonne */
    #view-empty { align-items: center; justify-content: center; padding: 24px; }

    /* Éditeur */
    .editor-date { font-size: .74rem; color: var(--text-3); margin-bottom: 10px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
    .emotions { margin-bottom: 10px; }
    .emotions > button { min-height: 40px; flex-direction: row; padding: 4px 10px; font-size: .82rem; }
    .domains { display: flex; gap: 6px; flex-wrap: wrap; }
    .domain-btn { cursor: pointer; font-family: inherit; text-transform: uppercase; letter-spacing: .04em; font-size: .72rem; }
    .domain-btn[aria-pressed="true"][data-key="none"]  { color: var(--text-1); border-color: var(--line-strong); background: var(--surface-3); }
    .domain-btn[aria-pressed="true"][data-key="body"]  { color: var(--corps); border-color: var(--corps); background: var(--surface-2); }
    .domain-btn[aria-pressed="true"][data-key="heart"] { color: var(--coeur); border-color: var(--coeur); background: var(--surface-2); }
    .domain-btn[aria-pressed="true"][data-key="etre"]  { color: var(--etre);  border-color: var(--etre);  background: var(--surface-2); }
    .domain-btn[aria-pressed="true"][data-key="order"] { color: var(--ordre); border-color: var(--ordre); background: var(--surface-2); }
    .editor-title-input { width: 100%; font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; background: transparent; border: none; border-bottom: 1px solid var(--line); border-radius: 0; color: var(--text-1); padding: 0 0 9px; margin-bottom: 10px; }
    .editor-title-input:focus { outline: none; border-bottom-color: var(--leaf); }
    .editor-title-input::placeholder { color: var(--text-3); }
    .jr-prompt { display: none; width: 100%; text-align: left; font: inherit; margin-bottom: 10px; padding: 12px 16px; background: var(--surface-2); border: 1px solid rgba(132,194,94,.3); border-radius: 12px; cursor: pointer; color: var(--text-1); }
    .jr-prompt:hover { background: var(--surface-3); }
    .jr-prompt-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: .68rem; text-transform: uppercase; letter-spacing: .09em; color: var(--leaf-text); font-weight: 700; }
    .jr-prompt-head small { font-size: .72rem; color: var(--text-3); text-transform: none; letter-spacing: 0; font-weight: 500; }
    #prompt-text { font-size: .9rem; color: var(--text-1); line-height: 1.6; font-style: italic; }
    .editor-content-input { width: 100%; flex: 1; min-height: 180px; background: transparent; border: none; color: var(--text-1); resize: none; font: inherit; font-size: .96rem; line-height: 1.85; padding: 0; }
    .editor-content-input:focus { outline: none; }
    .editor-content-input::placeholder { color: var(--text-3); }
    .editor-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--line); margin-top: 10px; flex-shrink: 0; }
    .word-count { font-size: .74rem; color: var(--text-3); font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .word-count-bar { display: inline-block; height: 3px; width: 40px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
    .word-count-bar-fill { height: 100%; background: var(--leaf); border-radius: 3px; transition: width .3s ease; }
    .editor-actions { display: flex; gap: 8px; }

    /* Lecture */
    #read-domain-bar { height: 3px; width: 100%; background: transparent; flex-shrink: 0; }
    .read-title { font-size: 1.3rem; margin: 0 0 6px; }
    .read-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .78rem; color: var(--text-2); }
    .read-meta > span:empty { display: none; }
    .edited-badge { font-style: italic; color: var(--text-3); }
    .read-content { font-size: .96rem; line-height: 1.85; color: var(--text-1); white-space: pre-wrap; }
    .read-footer { display: flex; justify-content: flex-end; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); margin-top: 14px; }

    /* Statistiques */
    .stats-panel { display: none; flex-direction: column; height: 100%; overflow: hidden; }
    .stats-panel.active { display: flex; }
    .stats-scroll { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 22px; }
    .stats-kpi-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .kpi-card { background: var(--surface-1); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
    .kpi-val { font-size: 1.6rem; line-height: 1; }
    .kpi-label { font-size: .74rem; color: var(--text-2); margin-top: 4px; }
    .months-chart { display: flex; gap: 6px; align-items: flex-end; height: 80px; }
    .month-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; }
    .month-bar-bg { width: 100%; background: var(--surface-2); border-radius: 6px; overflow: hidden; flex: 1; display: flex; align-items: flex-end; min-height: 8px; }
    .month-bar-fill { width: 100%; background: var(--leaf); border-radius: 6px; }
    .month-label { font-size: .68rem; color: var(--text-3); font-weight: 700; }
    .month-count { font-size: .68rem; color: var(--text-2); min-height: 1em; }
    .emo-stat-list { display: flex; flex-direction: column; gap: 7px; }
    .emo-stat-row { display: flex; align-items: center; gap: 8px; }
    .emo-stat-bar-bg { flex: 1; height: 6px; background: var(--surface-2); border-radius: 10px; overflow: hidden; }
    .emo-stat-bar-fill { height: 100%; border-radius: 10px; background: var(--leaf); }
    .emo-stat-label { font-size: .82rem; min-width: 96px; }
    .emo-stat-count { font-size: .78rem; color: var(--text-2); min-width: 22px; text-align: right; }
    .domain-stat-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .domain-stat-pill { display: flex; align-items: center; gap: 8px; background: var(--surface-1); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
    .domain-stat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .domain-stat-name { font-size: .82rem; flex: 1; }
    .domain-stat-cnt { font-size: .82rem; font-weight: 700; }

    @media (max-width: 900px) {
      .jr-grid { grid-template-columns: 1fr; grid-template-rows: minmax(0, 38%) minmax(0, 1fr); }
    }
    @media (max-width: 640px) {
      .jr-col-head, .jr-col-body { padding-left: 12px; padding-right: 12px; }
      .domain-stat-list { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      .entry-item, .word-count-bar-fill { transition: none; }
    }
  </style>
</head>
<body>
  <main class="page-shell" aria-labelledby="page-title">
    <header class="page-head">
      <div class="page-head-id">
        <h1 id="page-title"><span class="ic" data-icon="book"></span>Journal</h1>
        <p class="page-sub">Ce que tu déposes, jour après jour. Le texte reste ici.</p>
      </div>
      <div class="page-actions">
        <button class="btn quiet sm" type="button" id="btn-export" title="Exporter toutes les entrées en JSON"><span class="ic" data-icon="download"></span>Exporter</button>
        <button class="btn sm" type="button" id="btn-stats-toggle" aria-pressed="false"><span class="ic" data-icon="chart"></span>Statistiques</button>
        <button class="btn primary" type="button" id="btn-new-entry"><span class="ic" data-icon="plus"></span>Nouvelle entrée</button>
      </div>
    </header>

    <div class="page-body">
      <div class="jr-grid">
        <!-- La liste des entrées -->
        <aside class="jr-col" aria-label="Entrées du journal">
          <div class="jr-col-head">
            <div class="jr-count" id="entry-count"><span class="sk" style="width:90px;height:12px"></span></div>
            <div class="jr-stats" id="sidebar-stats"></div>
            <div class="jr-search">
              <input class="input" type="search" id="journal-search" placeholder="Rechercher" aria-label="Rechercher dans le journal" autocomplete="off" />
              <button class="search-clear" type="button" id="search-clear" aria-label="Effacer la recherche"><span class="ic" data-icon="x" data-icon-size="14"></span></button>
            </div>
            <div class="filter-section-label">Humeur</div>
            <div class="filter-pills" id="filter-pills" role="group" aria-label="Filtrer par humeur"></div>
            <div class="filter-section-label" id="domain-filter-label">Domaine</div>
            <div class="filter-pills" id="domain-filter-pills" role="group" aria-label="Filtrer par domaine"></div>
            <div class="mood-chart-wrap" id="mood-chart-wrap" style="display:none">
              <div class="filter-section-label">Humeur sur 7 jours</div>
              <div class="mood-chart" id="mood-chart"></div>
            </div>
          </div>
          <div class="jr-col-body" id="entry-list"></div>
        </aside>

        <!-- Le panneau principal -->
        <section class="jr-col" id="main-panel" aria-label="Entrée">

          <!-- État vide -->
          <div class="jr-col-body" id="view-empty">
            <div class="empty center">
              <span class="empty-ic"><span class="ic" data-icon="edit"></span></span>
              <h3>Commence à écrire</h3>
              <p>Choisis une entrée à gauche, ou ouvre-en une nouvelle pour aujourd'hui.</p>
              <button class="btn primary" type="button" id="btn-empty-new"><span class="ic" data-icon="plus"></span>Écrire aujourd'hui</button>
            </div>
          </div>

          <!-- Éditeur -->
          <div style="display:none;flex-direction:column;height:100%;overflow:hidden" id="view-editor">
            <div class="jr-col-head">
              <div class="editor-date" id="editor-date"></div>
              <div class="pick emotions" id="emotion-picker" role="group" aria-label="Comment tu te sens"></div>
              <div class="domains" id="domain-picker" role="group" aria-label="Domaine de l'entrée"></div>
            </div>
            <div class="jr-col-body column">
              <input type="text" class="editor-title-input" id="editor-title" placeholder="Titre (facultatif)" aria-label="Titre de l'entrée" maxlength="120" />
              <button type="button" class="jr-prompt" id="prompt-du-jour" title="Utiliser cette amorce">
                <span class="jr-prompt-head"><span>Amorce du jour</span><small>Cliquer pour la reprendre</small></span>
                <span id="prompt-text"></span>
              </button>
              <textarea class="editor-content-input" id="editor-content" aria-label="Texte de l'entrée" placeholder="Commence à écrire. Que s'est-il passé aujourd'hui ? Comment tu te sens ? Quelles pensées te traversent ?"></textarea>
              <div class="editor-footer">
                <span class="word-count" id="word-count">
                  <span class="word-count-bar"><span class="word-count-bar-fill" id="wc-bar" style="width:0%"></span></span>
                  <span id="wc-label">0 mot</span>
                </span>
                <div class="editor-actions">
                  <button class="btn quiet" type="button" id="btn-cancel-edit">Annuler</button>
                  <button class="btn primary" type="button" id="btn-save-entry">Sauvegarder</button>
                </div>
              </div>
            </div>
          </div>

          <!-- Statistiques -->
          <div class="stats-panel" id="view-stats">
            <div class="jr-col-head">
              <h2 style="font-size:1.1rem;margin:0">Statistiques du journal</h2>
              <div class="jr-count" id="stats-sub"></div>
            </div>
            <div class="stats-scroll" id="stats-content"></div>
          </div>

          <!-- Lecture -->
          <div style="display:none;flex-direction:column;height:100%;overflow:hidden" id="view-read">
            <div id="read-domain-bar"></div>
            <div class="jr-col-head">
              <h2 class="read-title" id="read-title"></h2>
              <div class="read-meta">
                <span id="read-emotion-badge"></span>
                <span id="read-date"></span>
                <span id="read-domain-badge"></span>
                <span id="read-word-count"></span>
                <span id="read-edited-badge" class="edited-badge" style="display:none">(modifié)</span>
              </div>
            </div>
            <div class="jr-col-body">
              <div class="read-content" id="read-content"></div>
              <div class="read-footer">
                <button class="btn danger" type="button" id="btn-delete-entry">Supprimer</button>
                <button class="btn" type="button" id="btn-edit-entry"><span class="ic" data-icon="edit"></span>Modifier</button>
              </div>
            </div>
          </div>

        </section>
      </div>
    </div>
  </main>

  <script type="module" src="/js/journal.js"></script>
</body>
</html>
