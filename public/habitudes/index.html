<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <script src="/js/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Habitudes - Change Your Life</title>
  <meta name="description" content="Suis tes habitudes quotidiennes, construis des séries et installe durablement les gestes qui te font avancer.">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0a0f0a">
  <meta name="msapplication-TileColor" content="#0a0f0a">
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="/css/main.min.css" />
  <link rel="stylesheet" href="/css/transitions.css" />
  <style>
    .content-area { display: flex; flex-direction: column; gap: 20px; }

    /* Le jour en un coup d'oeil */
    .dp-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .dp-title { font-size: .88rem; font-weight: 600; }
    .dp-count { font-size: .82rem; color: var(--text-2); }
    .dp-bar-bg { height: 6px; background: var(--surface-3); border-radius: 6px; overflow: hidden; }
    .dp-bar { height: 100%; background: var(--leaf); border-radius: 6px; transition: width .6s ease; }
    .dp-domains { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }

    /* Les habitudes, groupées par domaine */
    .domain-section-title { color: var(--dom, var(--text-3)); }
    .habits-list { display: flex; flex-direction: column; gap: 8px; }
    .habit-card { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; border-radius: 12px; background: var(--surface-1); border: 1px solid var(--line); position: relative; overflow: hidden; transition: background var(--duration), border-color var(--duration); }
    .habit-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--habit-color, var(--line-strong)); opacity: .6; }
    .habit-card:hover { background: var(--surface-2); border-color: var(--line-strong); }
    .habit-card.done-today { background: rgba(132,194,94,.06); border-color: rgba(132,194,94,.22); }
    .habit-card.done-today::before { background: var(--leaf); opacity: .9; }
    .habit-check { width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; color: transparent; padding: 0; }
    .habit-check::before { content: ''; position: absolute; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line-strong); transition: border-color var(--duration), background var(--duration); }
    .habit-check svg { position: relative; }
    .habit-check:hover::before { border-color: var(--text-3); }
    .habit-check:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }
    .habit-card.done-today .habit-check { color: var(--leaf); }
    .habit-card.done-today .habit-check::before { background: rgba(132,194,94,.18); border-color: var(--leaf); }
    .habit-emoji { font-size: 1.35rem; flex-shrink: 0; }
    .habit-body { flex: 1; min-width: 0; }
    .habit-name { font-size: .92rem; font-weight: 600; }
    .habit-meta { font-size: .76rem; color: var(--text-3); margin-top: 2px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .habit-streak { display: inline-flex; align-items: center; gap: 4px; color: var(--gold-text); }
    .habit-done-label { display: inline-flex; align-items: center; gap: 4px; color: var(--leaf-text); }
    .habit-actions { display: flex; gap: 4px; }
    .habit-actions .btn { width: 36px; padding: 0; }

    /* Fenetre d'ajout */
    .modal .field { margin-bottom: 16px; }
    .modal .pick > button { min-width: 44px; padding: 0; font-size: 1.2rem; }

    @media (max-width: 900px) {
      .habit-card { padding: 8px 10px 8px 14px; gap: 8px; }
    }
    @media (max-width: 640px) {
      .habit-meta { gap: 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .dp-bar, .habit-card, .habit-check::before { transition: none; }
    }
  </style>
</head>
<body>
  <main class="page-shell" aria-labelledby="page-title">
    <header class="page-head">
      <div class="page-head-id">
        <h1 id="page-title"><span class="ic" data-icon="checks"></span>Habitudes</h1>
        <p class="page-sub">Tes routines, une journée à la fois.</p>
      </div>
      <div class="page-actions">
        <button class="btn primary" type="button" id="btn-add"><span class="ic" data-icon="plus"></span>Nouvelle habitude</button>
      </div>
    </header>
    <div class="page-body">
      <div class="content-area" id="content-area">
        <div class="card" aria-hidden="true">
          <span class="sk" style="width:40%;height:14px;margin-bottom:12px"></span>
          <span class="sk" style="height:6px"></span>
        </div>
        <span class="sk" style="height:58px"></span>
        <span class="sk" style="height:58px"></span>
      </div>
    </div>
  </main>

  <!-- Ajout / modification -->
  <div class="modal-veil" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <h2 id="modal-title">Nouvelle habitude</h2>
      <p class="t-muted" style="margin:0 0 16px;font-size:.86rem">Un geste court et concret, que tu peux refaire demain.</p>
      <div class="field">
        <label for="input-name">Nom de l'habitude</label>
        <input type="text" class="input" id="input-name" placeholder="Ex : méditer 10 min, lire 20 pages" maxlength="60" />
      </div>
      <div class="field">
        <span class="field-label" id="emoji-label">Emoji</span>
        <div class="pick" id="emoji-picker" role="group" aria-labelledby="emoji-label">
          <button type="button" class="emoji-opt" data-e="✅" aria-pressed="true">✅</button>
          <button type="button" class="emoji-opt" data-e="🧘" aria-pressed="false">🧘</button>
          <button type="button" class="emoji-opt" data-e="📚" aria-pressed="false">📚</button>
          <button type="button" class="emoji-opt" data-e="💪" aria-pressed="false">💪</button>
          <button type="button" class="emoji-opt" data-e="🥗" aria-pressed="false">🥗</button>
          <button type="button" class="emoji-opt" data-e="💧" aria-pressed="false">💧</button>
          <button type="button" class="emoji-opt" data-e="🏃" aria-pressed="false">🏃</button>
          <button type="button" class="emoji-opt" data-e="😴" aria-pressed="false">😴</button>
          <button type="button" class="emoji-opt" data-e="📔" aria-pressed="false">📔</button>
          <button type="button" class="emoji-opt" data-e="🎯" aria-pressed="false">🎯</button>
          <button type="button" class="emoji-opt" data-e="❤️" aria-pressed="false">❤️</button>
          <button type="button" class="emoji-opt" data-e="✨" aria-pressed="false">✨</button>
          <button type="button" class="emoji-opt" data-e="⚡" aria-pressed="false">⚡</button>
          <button type="button" class="emoji-opt" data-e="🌿" aria-pressed="false">🌿</button>
          <button type="button" class="emoji-opt" data-e="🎵" aria-pressed="false">🎵</button>
          <button type="button" class="emoji-opt" data-e="🧠" aria-pressed="false">🧠</button>
        </div>
      </div>
      <div class="field">
        <label for="input-domain">Domaine</label>
        <select class="select" id="input-domain">
          <option value="body">Corps</option>
          <option value="heart">Cœur</option>
          <option value="etre">Être</option>
          <option value="order">Ordre</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn quiet" type="button" id="btn-modal-cancel">Annuler</button>
        <button class="btn primary" type="button" id="btn-modal-save">Enregistrer</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/habitudes.js"></script>
</body>
</html>
