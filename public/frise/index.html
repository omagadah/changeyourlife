<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <script src="/js/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Frise chronologique - Change Your Life</title>
  <meta name="description" content="Ta vie sur un axe, en carte mentale ou par pilier : d'où tu viens, où tu en es, où tu vas.">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0a0f0a">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/main.min.css"/>
  <link rel="stylesheet" href="/css/transitions.css"/>
  <style>
    /* ════════════════════════════════════════════════════════════
       FRISE CHRONOLOGIQUE - trois angles sur la même vie.
       Les vues ne dupliquent rien : elles relisent le même arbre autrement.
       ════════════════════════════════════════════════════════════ */
    /* La carte mentale gère son propre déplacement : en mode carte, le corps
       ne défile plus et la scène prend toute la hauteur. */
    body.fr-mapmode .page-body { overflow:hidden; display:flex; flex-direction:column; }

    .fr-line1 { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
    .fr-line2 { display:flex; align-items:center; gap:12px; flex-wrap:wrap; font-size:.76rem; color:var(--text-3); margin-bottom:10px; }
    .fr-save { font-weight:600; }
    .fr-save.on { color:var(--text-3); } .fr-save.ok { color:var(--leaf-text); } .fr-save.err { color:var(--red); }

    .view-panel { display:none; }
    .view-panel.active { display:flex; flex-direction:column; flex:1; min-height:0; }

    /* ══ VUE 1 : LA FRISE PLATE ══ */
    .fr-ribbon { padding:52px 6px 56px; }
    .fr-track { position:relative; height:8px; border-radius:99px; background:var(--surface-2); border:1px solid var(--line); }
    .fr-track-past { position:absolute; top:0; bottom:0; left:0; border-radius:99px; background:var(--leaf-deep); }
    .fr-arrow { position:absolute; right:-13px; top:50%; margin-top:-8px; width:0; height:0;
      border-left:15px solid var(--leaf); border-top:8px solid transparent; border-bottom:8px solid transparent; }
    .fr-now { position:absolute; top:-9px; bottom:-9px; width:2px; background:var(--leaf); }
    .fr-now span { position:absolute; top:-19px; left:50%; transform:translateX(-50%); font-size:.66rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--leaf-text); white-space:nowrap; }

    .fr-pin { position:absolute; transform:translateX(-50%); background:none; border:none; cursor:pointer; padding:0; display:flex; flex-direction:column; align-items:center; }
    .fr-pin-dot { width:11px; height:11px; border-radius:50%; background:var(--ac); box-shadow:0 0 0 3px var(--bg-surface); flex-shrink:0; }
    .fr-pin-lab { max-width:120px; text-align:center; }
    .fr-pin-lab b { display:-webkit-box; font-size:.74rem; color:var(--text-1); line-height:1.25; overflow:hidden; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
    .fr-pin-lab small { display:block; font-size:.66rem; color:var(--text-3); margin-top:1px; }
    .fr-pin.above { bottom:4px; flex-direction:column-reverse; }
    .fr-pin.above .fr-pin-dot { margin-top:5px; }
    .fr-pin.below { top:4px; }
    .fr-pin.below .fr-pin-dot { margin-bottom:5px; }
    .fr-pin:hover .fr-pin-lab b { color:var(--ac); }

    .fr-empty-axis { font-size:.84rem; color:var(--text-2); line-height:1.6; text-align:center; max-width:38rem; margin:0 auto 18px; }
    .fr-empty-axis b { color:var(--text-1); }

    .fr-eras3 { display:grid; grid-template-columns:repeat(auto-fit, minmax(238px, 1fr)); gap:12px; }
    .fr-era3 { background:var(--surface-1); border:1px solid var(--line); border-radius:var(--r); padding:13px 15px; border-top:3px solid var(--ac); }
    .fr-era3 header { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
    .fr-era3 header b { font-size:.9rem; }
    .fr-era3 header span { font-size:.76rem; color:var(--text-3); }
    .fr-bar { height:5px; border-radius:99px; background:var(--surface-2); margin:9px 0 5px; overflow:hidden; }
    .fr-bar i { display:block; height:100%; background:var(--ac); border-radius:99px; transition:width .4s; }
    .fr-cnt { font-size:.72rem; color:var(--text-3); }
    .fr-mini { list-style:none; margin:9px 0 0; padding:0; display:flex; flex-direction:column; gap:2px; }
    .fr-mini li.mut { font-size:.78rem; color:var(--text-3); padding:3px 0; }
    .fr-mini button { width:100%; text-align:left; background:none; border:none; cursor:pointer; font:inherit; font-size:.78rem; color:var(--text-2); padding:5px 7px; border-radius:7px; }
    .fr-mini button:hover { background:var(--surface-2); color:var(--text-1); }

    /* ══ VUE 2 : LA CARTE MENTALE ══ */
    .fm-bar { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:9px; }
    .fm-b.on { background:rgba(241,205,146,.16); border-color:rgba(241,205,146,.45); color:var(--gold-text); }
    #fm-hint { font-size:.74rem; color:var(--text-3); margin-left:auto; text-align:right; max-width:34rem; }

    .fm-stage { position:relative; flex:1; min-height:340px; overflow:hidden; border-radius:var(--r); background:var(--surface-1); border:1px solid var(--line); cursor:grab; touch-action:none; }
    .fm-stage.grabbing { cursor:grabbing; }
    .fm-stage.link-mode { cursor:crosshair; }
    .fm-world { position:absolute; top:0; left:0; transform-origin:0 0; }
    .fm-links { position:absolute; top:0; left:0; overflow:visible; pointer-events:none; }
    .fm-edge { fill:none; stroke-width:2; opacity:.45; }
    .fm-free { fill:none; stroke:var(--gold); stroke-width:1.7; stroke-dasharray:5 5; opacity:.8; }

    .fm-node { position:absolute; box-sizing:border-box; padding:8px 24px 8px 11px; border-radius:var(--r-sm); background:var(--bg-elevated); border:1px solid var(--line);
      border-left:3px solid var(--ac); cursor:grab; user-select:none; box-shadow:var(--shadow-sm); transition:box-shadow var(--duration), border-color var(--duration); }
    .fm-node:hover { border-color:var(--ac); }
    .fm-node.sel { box-shadow:0 0 0 2px var(--ac); }
    .fm-node.linking { box-shadow:0 0 0 2px var(--gold); }
    .fm-node.drop { box-shadow:0 0 0 2px var(--leaf); }
    .fm-node.dragging { opacity:.6; cursor:grabbing; }
    .fm-node.root { background:var(--surface-3); }
    .fm-node.d0 .fm-t { font-size:.94rem; font-weight:700; }
    .fm-node.d1 .fm-t { font-size:.84rem; font-weight:600; }
    .fm-t { font-size:.8rem; font-weight:600; color:var(--text-1); line-height:1.3; word-break:break-word; }
    .fm-t[contenteditable="true"] { outline:none; background:rgba(132,194,94,.14); border-radius:4px; cursor:text; user-select:text; }
    .fm-s { font-size:.72rem; color:var(--text-2); line-height:1.4; margin-top:3px; }
    .fm-s.hint { color:var(--text-3); font-style:italic; }
    .fm-meta { display:flex; align-items:center; gap:6px; margin-top:5px; }
    .fm-date { font-size:.66rem; font-weight:600; color:var(--gold-text); background:rgba(231,177,92,.14); padding:1px 6px; border-radius:99px; }
    .fm-fold { font-size:.66rem; font-weight:700; cursor:pointer; padding:1px 7px; border-radius:99px; background:var(--surface-2); border:1px solid var(--line); color:var(--text-3); }
    .fm-fold:hover { color:var(--text-1); border-color:var(--ac); }
    .fm-add { position:absolute; top:6px; right:6px; width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.8rem; line-height:1;
      cursor:pointer; background:var(--surface-2); border:1px solid var(--line); color:var(--text-3); opacity:0; transition:opacity var(--duration); }
    .fm-node:hover .fm-add, .fm-node.sel .fm-add, .fm-add:focus-visible { opacity:1; }
    .fm-add:hover { background:var(--leaf); color:#08130a; border-color:var(--leaf); }

    /* ══ VUE 3 : LES PILIERS ══ */
    .fr-pgrid { display:grid; grid-template-columns:repeat(auto-fit, minmax(212px, 1fr)); gap:11px; align-items:start; }
    .fr-pcol { background:var(--surface-1); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; border-top:3px solid var(--ac); }
    .fr-phead { display:flex; align-items:center; gap:8px; padding:11px 13px 9px; }
    .fr-phead .ic { color:var(--ac); }
    .fr-phead b { font-size:.84rem; }
    .fr-pblock { border-top:1px solid var(--line); padding:9px 13px 11px; }
    .fr-pera { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:5px; }
    .fr-pera b { font-size:.68rem; letter-spacing:.05em; text-transform:uppercase; color:var(--text-3); }
    .fr-pera small { font-size:.7rem; color:var(--text-3); }
    .fr-pcol ul { list-style:none; margin:0; padding:0; }
    .fr-pcol li.mut { font-size:.76rem; color:var(--text-3); }
    .fr-pcol li button { width:100%; text-align:left; background:none; border:none; cursor:pointer; font:inherit; font-size:.78rem; color:var(--text-3); padding:5px 6px; border-radius:7px; display:flex; gap:7px; align-items:baseline; line-height:1.35; }
    .fr-pcol li button:hover { background:var(--surface-2); color:var(--text-1); }
    .fr-pcol li.on button { color:var(--text-1); }
    .fr-pcol li .tick { font-size:.6rem; color:var(--ac); flex-shrink:0; }

    /* ══ PANNEAU D'INSPECTION ══ (fixed : data-cyl-shift le pousse hors du panneau CYL) */
    #fr-insp { position:fixed; top:20px; right:20px; bottom:20px; width:352px; z-index:60; background:var(--sheet-bg); border:1px solid var(--line-strong); border-radius:var(--r-lg);
      box-shadow:var(--shadow); padding:15px 17px; overflow-y:auto; transform:translateX(calc(100% + 40px)); transition:transform .26s var(--ease); }
    #fr-insp.open { transform:none; }
    .fi-top { display:flex; align-items:flex-start; gap:10px; margin-bottom:11px; }
    #fi-path { font-size:.72rem; color:var(--text-3); line-height:1.45; flex:1; word-break:break-word; }
    #fi-close { flex-shrink:0; }
    #fi-tag { margin-bottom:10px; }
    #fi-tag[hidden] { display:none; }
    .fi-lb { display:block; font-size:.68rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--text-3); margin:11px 0 4px; }
    #fi-note { min-height:132px; line-height:1.55; }
    #fi-note::placeholder { font-style:italic; }
    .fi-mut { font-size:.74rem; color:var(--text-3); line-height:1.5; }
    .fi-link { display:flex; align-items:center; gap:8px; padding:5px 9px; border-radius:9px; background:var(--surface-1); border:1px solid var(--line); margin-bottom:4px; }
    .fi-link span { flex:1; font-size:.76rem; color:var(--text-2); }
    .fi-link button { background:none; border:none; color:var(--text-3); cursor:pointer; min-width:32px; min-height:32px; display:inline-grid; place-items:center; border-radius:6px; }
    .fi-link button:hover { color:var(--red); background:var(--surface-2); }
    .fi-acts { display:flex; gap:7px; margin-top:15px; }
    .fi-acts .btn { flex:1; }

    #fr-boot { padding:40px 0; text-align:center; font-size:.84rem; color:var(--text-3); }

    @media (max-width:900px) {
      #fr-insp { top:auto; left:8px; right:8px; bottom:8px; width:auto; max-height:64vh; transform:translateY(calc(100% + 24px)); }
      #fr-insp.open { transform:none; }
      #fm-hint { margin-left:0; text-align:left; }
    }
    @media (max-width:640px) {
      .fr-ribbon { padding:46px 4px 50px; }
      .fr-pin-lab { max-width:82px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #fr-insp { transition:none; }
    }
  </style>
</head>
<body>
  <main class="page-shell" aria-labelledby="page-title">
    <header class="page-head">
      <div class="page-head-id">
        <h1 id="page-title"><span class="ic" data-icon="timeline"></span>Frise chronologique</h1>
        <p class="page-sub">La mémoire longue de ta vie. L'agenda montre tes semaines ; la frise montre tes décennies. Trois façons de la regarder : l'axe du passé vers le futur, la carte où tout se relie, les piliers domaine par domaine.</p>
      </div>
      <div class="page-actions">
        <button class="btn sm" id="fr-export" type="button"><span class="ic" data-icon="download"></span>Exporter</button>
        <button class="btn sm" id="fr-print" type="button">Imprimer</button>
      </div>
    </header>

    <div class="page-body">
      <div class="fr-line1">
        <div class="seg view-switcher" role="group" aria-label="Changer de vue">
          <button class="view-btn active" data-view="frise" type="button" aria-pressed="true">Frise</button>
          <button class="view-btn" data-view="map" type="button" aria-pressed="false">Carte mentale</button>
          <button class="view-btn" data-view="piliers" type="button" aria-pressed="false">Piliers</button>
        </div>
      </div>

      <div class="fr-line2">
        <span id="fr-stats"></span>
        <span class="fr-save" id="fr-save" aria-live="polite"></span>
      </div>

      <div id="fr-boot">Chargement de ta frise…</div>

      <!-- Vue 1 : l'axe -->
      <div class="view-panel" id="view-frise">
        <div id="fr-axisview"></div>
      </div>

      <!-- Vue 2 : la carte mentale -->
      <div class="view-panel" id="view-map">
        <div class="fm-bar">
          <button class="btn sm fm-b" id="fm-link" type="button" aria-pressed="false"><span class="ic" data-icon="arrowRight"></span>Relier</button>
          <button class="btn sm fm-b" id="fm-fit" type="button"><span class="ic" data-icon="minimize"></span>Recadrer</button>
          <button class="btn sm fm-b" id="fm-open" type="button">Tout déplier</button>
          <button class="btn sm fm-b" id="fm-close" type="button">Tout replier</button>
          <span id="fm-hint"></span>
        </div>
        <div id="fm-host"></div>
      </div>

      <!-- Vue 3 : les piliers -->
      <div class="view-panel" id="view-piliers">
        <div id="fr-pilview"></div>
      </div>
    </div>
  </main>

  <aside id="fr-insp" aria-label="Détail de l'élément" data-cyl-shift>
    <div class="fi-top">
      <div id="fi-path"></div>
      <button id="fi-close" class="btn quiet sm tap" type="button" aria-label="Fermer le panneau"><span class="ic" data-icon="x"></span></button>
    </div>
    <span id="fi-tag" class="chip"></span>

    <label class="fi-lb" for="fi-label">Titre</label>
    <input id="fi-label" class="input" type="text" maxlength="160" autocomplete="off">

    <label class="fi-lb" for="fi-note">Ce que tu veux en dire</label>
    <textarea id="fi-note" class="textarea" maxlength="4000"></textarea>

    <label class="fi-lb" for="fi-date">Date (facultative)</label>
    <input id="fi-date" class="input" type="date">

    <span class="fi-lb">Relié à</span>
    <div id="fi-links"></div>

    <div class="fi-acts">
      <button id="fi-add" class="btn" type="button"><span class="ic" data-icon="plus"></span>Ajouter dessous</button>
      <button id="fi-del" class="btn danger" type="button">Supprimer</button>
    </div>
  </aside>

  <script type="module" src="/js/frise.js"></script>
</body>
</html>
