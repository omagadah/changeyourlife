<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <script src="/js/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vérification email - Change Your Life</title>
  <meta name="description" content="Vérifie ton adresse email pour finaliser la création de ton compte Change Your Life.">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0a0f0a">
  <link rel="stylesheet" href="/css/main.min.css"/>
  <link rel="stylesheet" href="/css/transitions.css"/>
  <style>
    /* Vérification : un en-tête, une carte centrée, six cases. Tokens uniquement. */
    .page-head { max-width:70ch; margin-left:auto; margin-right:auto; }
    .verify { max-width:480px; margin:0 auto; text-align:center; }
    .email-badge { margin:8px 0 28px; word-break:break-all; }

    /* ── Les six cases ── */
    .otp-row { display:flex; gap:10px; justify-content:center; margin-bottom:12px; }
    .otp-box { width:56px; height:68px; font-family:var(--font-display); font-size:1.8rem; font-weight:600; text-align:center;
      background:var(--field-bg); border:2px solid var(--line-strong); border-radius:var(--r); color:var(--text-1);
      transition:border-color var(--duration), background var(--duration), box-shadow var(--duration); caret-color:var(--leaf); }
    .otp-box:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-glow); }
    .otp-box.filled { border-color:var(--glass-border-hover); }
    .otp-box.error { border-color:var(--red); background:rgba(239,68,68,.08); animation:shake .3s ease; }
    .otp-box.success { border-color:var(--green); background:rgba(34,197,94,.1); }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

    .otp-hint { font-size:.8rem; color:var(--text-3); margin-bottom:22px; min-height:1.2em; }
    .status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--gold); animation:pulse 1.6s ease-in-out infinite; margin-right:6px; vertical-align:middle; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .error-msg { font-size:.86rem; color:var(--red); margin-bottom:14px; min-height:1.2em; }

    .verify .btn { width:100%; min-height:44px; margin-bottom:10px; }
    .cooldown { font-size:.8rem; color:var(--text-3); margin:-2px 0 12px; min-height:1.2em; }
    .divider { height:1px; background:var(--line); margin:8px 0 16px; }
    .signout-link { font:inherit; font-size:.84rem; color:var(--text-3); cursor:pointer; background:none; border:none; text-decoration:underline; text-underline-offset:2px; min-height:44px; }
    .signout-link:hover { color:var(--text-1); }

    /* Retour en haut de page, piloté par verify-email.js (classes show / success / info / error). */
    .notification { position:fixed; top:20px; left:50%; transform:translate(-50%, -100px); padding:12px 20px; border-radius:var(--r-sm);
      font-weight:600; z-index:2000; font-size:.9rem; opacity:0; visibility:hidden; pointer-events:none;
      background:var(--sheet-bg); color:var(--text-1); border:1px solid var(--line-strong); box-shadow:var(--shadow);
      transition:transform .35s var(--ease), opacity .35s ease, visibility .35s; }
    .notification.show { transform:translate(-50%, 0); opacity:1; visibility:visible; }
    .notification.success { border-color:var(--green); }
    .notification.info { border-color:var(--leaf); }
    .notification.error { border-color:var(--red); color:var(--red); }

    @media (max-width:640px) {
      .otp-row { gap:7px; }
      .otp-box { width:auto; flex:1 1 0; min-width:0; max-width:54px; height:60px; font-size:1.5rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .status-dot, .otp-box.error { animation:none; }
      .notification { transition:none; }
    }
  </style>
</head>
<body>
  <div id="notification" class="notification" role="status" aria-live="polite"></div>

  <main class="page-shell scroll" aria-labelledby="page-title">
    <header class="page-head">
      <div class="page-head-id">
        <h1 id="page-title"><span class="ic" data-icon="send"></span>Vérifie ton email</h1>
        <p class="page-sub">Un code à 6 chiffres vient de partir vers ton adresse. Entre-le ci-dessous pour ouvrir ton espace.</p>
      </div>
    </header>

    <div class="verify">
      <div class="chip email-badge" id="user-email-display">…</div>

      <div class="otp-row" id="otp-row" role="group" aria-label="Code de vérification à 6 chiffres">
        <input class="otp-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-index="0" autocomplete="one-time-code" aria-label="Chiffre 1">
        <input class="otp-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-index="1" autocomplete="off" aria-label="Chiffre 2">
        <input class="otp-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-index="2" autocomplete="off" aria-label="Chiffre 3">
        <input class="otp-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-index="3" autocomplete="off" aria-label="Chiffre 4">
        <input class="otp-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-index="4" autocomplete="off" aria-label="Chiffre 5">
        <input class="otp-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-index="5" autocomplete="off" aria-label="Chiffre 6">
      </div>
      <div class="otp-hint" id="otp-hint"><span class="status-dot" aria-hidden="true"></span> En attente de ton code…</div>
      <div class="error-msg" id="error-msg" role="alert"></div>

      <button type="button" class="btn primary" id="verify-btn" disabled>Vérifier mon email</button>

      <button type="button" class="btn" id="resend-btn">Renvoyer le code</button>
      <div class="cooldown" id="cooldown-msg"></div>

      <div class="divider"></div>
      <button type="button" class="signout-link" id="signout-btn">Se déconnecter et revenir à la connexion</button>
    </div>
  </main>

  <script type="module" src="/js/verify-email.js"></script>
</body>
</html>
