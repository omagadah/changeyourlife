<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <script src="/js/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Où j'en suis - Change Your Life</title>
  <meta name="description" content="Ta position, branche par branche : le palier de chaque branche de ton arbre et les jalons que tu y as posés.">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0a0f0a">
  <link rel="stylesheet" href="/css/main.min.css"/>
  <link rel="stylesheet" href="/css/transitions.css"/>
  <style>
    /* Propre à cette page. Tokens uniquement ; la couleur de branche vient de BRANCHES. */
    .yl-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ── Une branche ── */
    .br { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .br-head { display: grid; grid-template-columns: 36px 1fr auto; gap: 4px 12px; align-items: center; }
    .br-ic { grid-row: 1 / span 2; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
      background: var(--surface-2); color: var(--bc, var(--leaf)); }
    .br-ic svg { width: 18px; height: 18px; }
    .br-head h2 { margin: 0; font-size: 1.1rem; }
    .br-xp { grid-column: 3; grid-row: 1; font-family: var(--font-display); font-variation-settings: "opsz" 32;
      font-size: 1rem; font-weight: 600; color: var(--text-1); font-variant-numeric: tabular-nums; }
    .br-meta { grid-column: 2 / span 2; grid-row: 2; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center;
      font-size: .78rem; color: var(--text-2); }
    .br-meta .chip { min-height: 24px; font-size: .72rem; }
    .br.dormante .br-ic { color: var(--text-3); }
    .br-bar { height: 3px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
    .br-bar > i { display: block; height: 100%; width: 0; background: var(--bc, var(--leaf)); border-radius: 3px; transition: width var(--duration-slow) var(--ease); }
    .br.dormante .br-bar > i { background: var(--text-3); }

    /* ── Jalons ── */
    .jalons { display: flex; flex-direction: column; gap: 4px; }
    .jalon { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px; }
    .jalon > button.tog {
      min-height: 44px; padding: 6px 10px; border-radius: var(--r-sm); border: 1px solid transparent;
      background: transparent; color: var(--text-1); font: 500 .9rem/1.3 var(--font-body); cursor: pointer;
      display: flex; align-items: center; gap: 10px; text-align: left;
      transition: background var(--duration), border-color var(--duration);
    }
    .jalon > button.tog:hover { background: var(--surface-2); }
    .jalon .box { width: 20px; height: 20px; flex-shrink: 0; border-radius: 6px; border: 1.5px solid var(--line-strong);
      display: grid; place-items: center; color: transparent; background: var(--field-bg); transition: background var(--duration), border-color var(--duration); }
    .jalon .box svg { width: 13px; height: 13px; }
    .jalon > button.tog[aria-pressed="true"] { color: var(--text-2); }
    .jalon > button.tog[aria-pressed="true"] .box { background: var(--bc, var(--leaf)); border-color: var(--bc, var(--leaf)); color: #08130a; }
    .jalon > button.tog[aria-pressed="true"] .lbl { text-decoration: line-through; text-decoration-color: var(--line-strong); }
    .jalon .del { min-width: 36px; min-height: 36px; border-radius: 9px; border: none; background: transparent; color: var(--text-3);
      display: grid; place-items: center; cursor: pointer; }
    .jalon .del:hover { background: var(--surface-2); color: var(--red); }
    .jalon .del svg { width: 14px; height: 14px; }
    .jalon-empty { font-size: .82rem; color: var(--text-3); padding: 4px 10px; }

    .yl-add { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .yl-add .input { min-height: 38px; }
    .yl-add .btn { min-height: 38px; }

    @media (max-width: 900px) { .yl-grid { grid-template-columns: 1fr; } }
    @media (max-width: 640px) { .br-head { grid-template-columns: 32px 1fr auto; } }
    @media (prefers-reduced-motion: reduce) { .br-bar > i { transition: none; } }
  </style>
</head>
<body>
  <main class="page-shell" aria-labelledby="page-title">
    <header class="page-head">
      <div class="page-head-id">
        <h1 id="page-title"><span class="ic" data-icon="compass"></span>Où j'en suis</h1>
        <p class="page-sub" id="yl-sub">Ton arbre, branche par branche : son palier, son XP, et les jalons que tu y as posés.</p>
      </div>
      <div class="page-actions">
        <span class="chip" id="yl-count" aria-live="polite"><span class="sk" style="width:120px;height:12px"></span></span>
        <button class="btn quiet sm" type="button" id="yl-export"><span class="ic" data-icon="download"></span>Exporter</button>
      </div>
    </header>
    <div class="page-body">
      <div class="yl-grid" id="yl-grid">
        <span class="sk" style="height:180px"></span>
        <span class="sk" style="height:180px"></span>
        <span class="sk" style="height:180px"></span>
        <span class="sk" style="height:180px"></span>
      </div>
    </div>
  </main>
  <script type="module" src="/js/yourlife.js"></script>
</body>
</html>
