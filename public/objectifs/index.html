<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <script src="/js/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Objectifs - Change Your Life</title>
  <meta name="description" content="Tes objectifs, leurs jalons et leur progression : des intentions qui deviennent des gestes concrets." />
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0a0f0a">
  <meta name="msapplication-TileColor" content="#0a0f0a">
  <link rel="stylesheet" href="/css/main.min.css" />
  <link rel="stylesheet" href="/css/transitions.css" />
  <style>
    .content-area { display: grid; gap: 16px; align-content: start; }

    /* Reperes et filtres */
    .stats-bar { display: flex; gap: 8px; flex-wrap: wrap; }
    .stats-bar .chip .sp-val { font-family: var(--font-display); font-size: .98rem; font-weight: 600; color: var(--text-1); }
    .stats-bar .chip.red { color: var(--red); border-color: rgba(239,68,68,.3); }
    .domain-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .domain-tab { cursor: pointer; font-family: inherit; min-height: 32px; }
    .domain-tab.active { color: var(--tab-color, var(--leaf-text)); background: color-mix(in srgb, var(--tab-color, var(--leaf)) 16%, transparent); border-color: color-mix(in srgb, var(--tab-color, var(--leaf)) 50%, transparent); }

    /* Demarrage rapide */
    .templates-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .template-card { background: var(--surface-1); border: 1px solid var(--line); border-radius: 12px; padding: 12px 10px; cursor: pointer; text-align: center; font: inherit; color: var(--text-1); transition: background var(--duration), border-color var(--duration); }
    .template-card:hover { background: var(--surface-2); border-color: var(--line-strong); }
    .template-icon { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: var(--surface-3); color: var(--tpl-color, var(--leaf-text)); margin: 0 auto 6px; }
    .template-name { font-size: .84rem; font-weight: 600; display: block; }

    /* Un objectif */
    .goals-grid { display: grid; gap: 14px; }
    .goal-card { padding: 16px 18px 14px 22px; position: relative; overflow: hidden; }
    .goal-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--goal-color, var(--line-strong)); opacity: .8; }
    .goal-card.completed { opacity: .6; }
    .goal-card.completed .goal-title { text-decoration: line-through; }
    .goal-card.overdue { border-color: rgba(239,68,68,.3); }
    .goal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 10px; }
    .goal-title { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; flex: 1; }
    .goal-domain { color: var(--goal-color); border-color: color-mix(in srgb, var(--goal-color) 40%, transparent); background: color-mix(in srgb, var(--goal-color) 12%, transparent); text-transform: uppercase; letter-spacing: .04em; font-size: .72rem; }
    .goal-desc { font-size: .88rem; color: var(--text-2); line-height: 1.5; margin-bottom: 12px; }

    .progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .progress-text { font-size: .8rem; color: var(--text-2); font-weight: 600; }
    .progress-pct { font-size: .8rem; font-weight: 700; color: var(--goal-color); }
    .overdue-tag { font-size: .74rem; color: var(--red); font-weight: 700; }
    .progress-bar { background: var(--surface-3); border-radius: 10px; height: 6px; overflow: hidden; margin-bottom: 10px; }
    .progress-fill { background: var(--goal-color); height: 100%; transition: width .5s var(--ease); }

    .progress-slider-wrap { margin-bottom: 10px; display: none; }
    .progress-slider-wrap.open { display: flex; align-items: center; gap: 10px; }
    .progress-slider { flex: 1; accent-color: var(--goal-color, var(--leaf)); cursor: pointer; min-height: 28px; }
    .slider-pct-label { font-size: .82rem; font-weight: 700; min-width: 36px; text-align: right; color: var(--goal-color); }

    /* Jalons */
    .subtasks-section { margin: 8px 0 12px; }
    .subtasks-toggle { display: inline-flex; align-items: center; gap: 5px; min-height: 32px; font-size: .78rem; font-weight: 700; color: var(--text-2); background: none; border: none; cursor: pointer; padding: 0; font-family: inherit; }
    .subtasks-toggle:hover { color: var(--text-1); }
    .subtasks-toggle .arrow { transition: transform .2s; display: inline-flex; }
    .subtasks-toggle.open .arrow { transform: rotate(90deg); }
    .subtasks-toggle .st-count { color: var(--text-3); font-weight: 600; margin-left: 2px; }
    .subtasks-list { margin-top: 8px; display: none; flex-direction: column; gap: 5px; }
    .subtasks-list.open { display: flex; }
    .subtask-item { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 8px; background: var(--surface-1); border: 1px solid var(--line); }
    .subtask-item:hover { background: var(--surface-2); }
    .subtask-check { width: 32px; height: 32px; border: none; background: transparent; cursor: pointer; flex-shrink: 0; display: grid; place-items: center; padding: 0; color: transparent; position: relative; }
    .subtask-check::before { content: ''; position: absolute; width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--line-strong); }
    .subtask-check svg { position: relative; }
    .subtask-check:focus-visible { outline: 2px solid var(--leaf); outline-offset: 1px; border-radius: 6px; }
    .subtask-check.done { color: var(--bg); }
    .subtask-check.done::before { background: var(--goal-color, var(--leaf)); border-color: var(--goal-color, var(--leaf)); }
    .subtask-label { flex: 1; font-size: .86rem; cursor: pointer; }
    .subtask-label.done { text-decoration: line-through; color: var(--text-3); }
    .subtask-date { font-size: .72rem; font-weight: 600; margin-left: auto; padding: 2px 7px; border-radius: 6px; background: var(--surface-3); color: var(--text-2); flex-shrink: 0; white-space: nowrap; }
    .subtask-date.overdue { color: var(--red); background: rgba(239,68,68,.14); }
    .subtask-date.soon { color: var(--gold-text); background: rgba(231,177,92,.14); }
    .subtask-del { width: 32px; height: 32px; flex-shrink: 0; color: var(--text-3); }
    .subtask-del:hover { color: var(--red); }
    .subtask-add-row { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
    .subtask-add-input { flex: 1; min-width: 140px; min-height: 36px; font-size: .84rem; border-style: dashed; }
    .subtask-add-date { width: 150px; min-height: 36px; font-size: .8rem; color-scheme: dark; }
    body.light-mode .subtask-add-date { color-scheme: light; }
    .next-milestone { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; margin: 10px 0 4px; background: rgba(132,194,94,.08); border: 1px solid rgba(132,194,94,.22); }
    .next-milestone-emoji { display: inline-flex; flex-shrink: 0; color: var(--leaf-text); }
    .next-milestone-label { flex: 1; min-width: 0; font-size: .84rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .next-milestone-date { font-size: .76rem; color: var(--leaf-text); font-weight: 700; flex-shrink: 0; }
    .next-milestone.overdue { background: rgba(239,68,68,.08); border-color: rgba(239,68,68,.25); }
    .next-milestone.overdue .next-milestone-date, .next-milestone.overdue .next-milestone-emoji { color: var(--red); }
    .next-milestone.soon { background: rgba(231,177,92,.08); border-color: rgba(231,177,92,.28); }
    .next-milestone.soon .next-milestone-date, .next-milestone.soon .next-milestone-emoji { color: var(--gold-text); }

    .goal-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .goal-actions .btn.active-slider { background: rgba(132,194,94,.14); border-color: rgba(132,194,94,.5); color: var(--leaf-text); }
    .goal-actions .btn.danger-confirm { background: rgba(239,68,68,.12); border-color: var(--red); color: var(--red); }

    .modal .field { margin-bottom: 14px; }

    @media (max-width: 900px) {
      .templates-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
    }
    @media (max-width: 640px) {
      .goal-card { padding: 14px 12px 12px 16px; }
      .subtask-add-date { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .progress-fill, .subtasks-toggle .arrow, .template-card { transition: none; }
    }
  </style>
</head>
<body>
  <main class="page-shell" aria-labelledby="page-title">
    <header class="page-head">
      <div class="page-head-id">
        <h1 id="page-title"><span class="ic" data-icon="target"></span>Objectifs</h1>
        <p class="page-sub">Des intentions qui deviennent des gestes concrets, jalon après jalon.</p>
      </div>
      <div class="page-actions">
        <button class="btn primary" type="button" id="btn-new-goal"><span class="ic" data-icon="plus"></span>Nouvel objectif</button>
      </div>
    </header>

    <div class="page-body">
      <div class="content-area">
        <div class="stats-bar" id="stats-bar" aria-label="Repères"></div>
        <div class="domain-tabs" id="domain-tabs" role="group" aria-label="Filtrer par domaine"></div>

        <section class="templates-section" id="templates-section" aria-label="Démarrage rapide">
          <div class="sec-label">Démarrage rapide</div>
          <div class="templates-grid" id="templates-grid"></div>
        </section>

        <div class="goals-grid" id="goals-grid"></div>

        <div class="empty" id="empty-state" hidden>
          <span class="empty-ic"><span class="ic" data-icon="target"></span></span>
          <h3>Aucun objectif ici</h3>
          <p>Un objectif, c'est une intention avec un cap. Commence par un seul, et découpe-le en jalons.</p>
          <button class="btn primary" type="button" id="btn-empty-new"><span class="ic" data-icon="plus"></span>Nouvel objectif</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Ajout / modification -->
  <div class="modal-veil" id="modal-goal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <h2 id="modal-title">Nouvel objectif</h2>
      <p class="t-muted" style="margin:0 0 16px;font-size:.86rem">Un cap clair, une date si tu veux, et des jalons ensuite.</p>
      <div class="field">
        <label for="input-title">Titre</label>
        <input class="input" type="text" id="input-title" placeholder="Ex : courir 5 km sans m'arrêter" />
      </div>
      <div class="field">
        <label for="input-desc">Description (facultatif)</label>
        <textarea class="textarea" id="input-desc" placeholder="Détails, motivation, contexte" style="min-height:76px"></textarea>
      </div>
      <div class="field">
        <label for="input-domain">Domaine</label>
        <select class="select" id="input-domain">
          <option value="body">Corps</option>
          <option value="heart">Cœur</option>
          <option value="etre">Être</option>
          <option value="order">Ordre</option>
        </select>
      </div>
      <div class="field">
        <label for="input-deadline">Date cible (facultatif)</label>
        <input class="input" type="date" id="input-deadline" />
      </div>
      <div class="modal-actions">
        <button class="btn quiet" type="button" id="btn-cancel-modal">Annuler</button>
        <button class="btn primary" type="button" id="btn-save-goal">Enregistrer</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/objectifs.js"></script>
</body>
</html>
