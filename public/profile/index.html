<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <script src="/js/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Profil - Change Your Life</title>
  <meta name="description" content="Ton profil Change Your Life : qui tu es ici, où en est ton arbre, et ton compte.">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0a0f0a">
  <link rel="stylesheet" href="/css/main.min.css"/>
  <link rel="stylesheet" href="/css/transitions.css"/>
  <style>
    /* Propre à cette page. Tokens uniquement. */
    .pf-blocks { display: flex; flex-direction: column; gap: 22px; max-width: 760px; }

    /* ── Identité ── */
    .pf-id { display: grid; grid-template-columns: 96px 1fr; gap: 18px 22px; align-items: start; }
    .pf-avatar {
      width: 96px; height: 96px; border-radius: 50%; overflow: hidden;
      background: var(--surface-3); border: 1px solid var(--line-strong);
      display: grid; place-items: center;
      font-family: var(--font-display); font-size: 2.2rem; font-weight: 600; color: var(--text-1);
      font-variation-settings: "opsz" 48;
    }
    .pf-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pf-avatar-actions { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
    .pf-avatar-actions .btn { width: 100%; }
    .pf-avatar-actions input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
    .pf-form { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    .pf-form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .pf-form .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
    .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ── Ton arbre ── */
    .pf-total { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
    .pf-total .t-num { font-size: 1.9rem; line-height: 1; }
    .pf-total small { font-size: .82rem; color: var(--text-2); }
    .br-list { display: flex; flex-direction: column; gap: 4px; }
    .br-row {
      display: grid; grid-template-columns: 32px 1fr auto; grid-template-rows: auto auto;
      gap: 2px 12px; align-items: center; padding: 10px 6px;
      border-bottom: 1px solid var(--line);
    }
    .br-row:last-child { border-bottom: none; }
    .br-ic { grid-row: 1 / span 2; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
      background: var(--surface-2); color: var(--bc, var(--leaf)); }
    .br-ic svg { width: 17px; height: 17px; }
    .br-name { font-size: .92rem; font-weight: 600; color: var(--text-1); }
    .br-palier { font-size: .78rem; color: var(--text-2); }
    .br-xp { grid-column: 3; grid-row: 1; font-family: var(--font-display); font-variation-settings: "opsz" 32;
      font-size: 1rem; font-weight: 600; color: var(--text-1); font-variant-numeric: tabular-nums; text-align: right; }
    .br-bar { grid-column: 2 / span 2; grid-row: 2; height: 3px; border-radius: 3px; background: var(--surface-3); overflow: hidden; align-self: end; margin-top: 6px; }
    .br-bar > i { display: block; height: 100%; width: 0; background: var(--bc, var(--leaf)); border-radius: 3px; transition: width var(--duration-slow) var(--ease); }
    .br-row.dormante .br-ic { color: var(--text-3); }
    .br-row.dormante .br-bar > i { background: var(--text-3); }

    .ouv-list { display: flex; flex-direction: column; gap: 8px; }
    .ouv { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-1); }
    .ouv .ic { color: var(--leaf-text); margin-top: 2px; }
    .ouv b { display: block; font-size: .88rem; color: var(--text-1); font-weight: 600; }
    .ouv p { margin: 2px 0 0; font-size: .8rem; color: var(--text-2); line-height: 1.45; }
    .ouv.off { opacity: .6; }
    .ouv.off .ic { color: var(--text-3); }
    .ouv.off .cond { color: var(--text-3); font-size: .76rem; display: block; margin-top: 3px; }

    /* ── Compte ── */
    .pf-account { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .pf-account .spacer { flex: 1; }
    .pf-account .note { flex-basis: 100%; font-size: .8rem; color: var(--text-3); margin: 4px 0 0; }

    @media (max-width: 640px) {
      .pf-id { grid-template-columns: 1fr; justify-items: start; }
      .pf-avatar-actions { flex-direction: row; }
      .pf-form .row { grid-template-columns: 1fr; }
      .br-row { grid-template-columns: 28px 1fr auto; }
    }
    @media (prefers-reduced-motion: reduce) { .br-bar > i { transition: none; } }
  </style>
</head>
<body>
  <main class="page-shell" aria-labelledby="page-title">
    <header class="page-head">
      <div class="page-head-id">
        <h1 id="page-title"><span class="ic" data-icon="user"></span>Profil</h1>
        <p class="page-sub">Qui tu es ici, où en est ton arbre, et ton compte.</p>
      </div>
    </header>
    <div class="page-body">
      <div class="pf-blocks">

        <!-- 1. Identité -->
        <section class="card" aria-labelledby="h-identite">
          <div class="sec-label" id="h-identite">Identité</div>
          <form class="pf-id" id="pf-form" novalidate>
            <div>
              <div class="pf-avatar" id="pf-avatar" aria-hidden="true">·</div>
              <div class="pf-avatar-actions">
                <label class="btn sm" for="pf-avatar-file"><span class="ic" data-icon="edit"></span>Photo</label>
                <input type="file" id="pf-avatar-file" accept="image/*">
                <button class="btn sm quiet" type="button" id="pf-avatar-clear" hidden>Retirer</button>
              </div>
            </div>
            <div class="pf-form">
              <div class="row">
                <div class="field">
                  <label for="pf-name">Nom affiché</label>
                  <input class="input" type="text" id="pf-name" autocomplete="nickname" maxlength="60" placeholder="Ton prénom, ou ce que tu veux">
                </div>
                <div class="field">
                  <label for="pf-title">Titre <span class="t-muted">(facultatif)</span></label>
                  <input class="input" type="text" id="pf-title" maxlength="12" placeholder="Ex. Explorateur">
                </div>
              </div>
              <div class="field">
                <label for="pf-bio">Bio</label>
                <textarea class="textarea" id="pf-bio" maxlength="280" placeholder="Ce que tu fais, ce qui compte pour toi, où tu en es."></textarea>
                <span class="field-hint"><span id="pf-bio-count">0</span> / 280</span>
              </div>
              <div class="row">
                <div class="field">
                  <label for="pf-website">Site web</label>
                  <input class="input" type="url" id="pf-website" inputmode="url" placeholder="https://">
                </div>
                <div class="field">
                  <label for="pf-email">Email</label>
                  <input class="input" type="email" id="pf-email" readonly>
                  <span class="field-hint">Se change dans les paramètres.</span>
                </div>
              </div>
              <div class="actions">
                <button class="btn primary" type="submit" id="pf-save"><span class="ic" data-icon="check"></span>Enregistrer</button>
              </div>
            </div>
          </form>
        </section>

        <!-- 2. Ton arbre -->
        <section class="card" aria-labelledby="h-arbre">
          <div class="sec-label" id="h-arbre">Ton arbre</div>
          <div class="pf-total">
            <span class="t-num" id="pf-xp-total"><span class="sk" style="width:64px;height:28px"></span></span>
            <small>XP, toutes branches confondues</small>
          </div>
          <div class="br-list" id="pf-branches">
            <span class="sk" style="height:44px"></span>
            <span class="sk" style="height:44px"></span>
            <span class="sk" style="height:44px"></span>
          </div>
          <div class="sec-label" style="margin-top:22px">Ce qui s'est ouvert</div>
          <div class="ouv-list" id="pf-ouvertures">
            <span class="sk" style="height:48px"></span>
          </div>
        </section>

        <!-- 3. Compte -->
        <section class="card" aria-labelledby="h-compte">
          <div class="sec-label" id="h-compte">Compte</div>
          <div class="pf-account">
            <a class="btn" href="/settings/"><span class="ic" data-icon="sliders"></span>Paramètres</a>
            <button class="btn quiet" type="button" id="pf-logout"><span class="ic" data-icon="logout"></span>Se déconnecter</button>
            <span class="spacer"></span>
            <a class="btn quiet danger" href="/settings/">Supprimer mon compte</a>
            <p class="note">La suppression se fait dans Paramètres, onglet Sécurité.</p>
          </div>
        </section>

      </div>
    </div>
  </main>
  <script type="module" src="/js/profile.js"></script>
</body>
</html>
