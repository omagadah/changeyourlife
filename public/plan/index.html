<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <script src="/js/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Aujourd'hui - Change Your Life</title>
  <meta name="description" content="Ton poste de pilotage quotidien : ton rythme de vie, tes besoins essentiels et tes tâches du jour - chaque action validée fait grandir ton arbre.">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0a0f0a">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/main.min.css"/>
  <link rel="stylesheet" href="/css/transitions.css"/>
  <style>
    /* Aujourd'hui : rythme du jour, base vitale, tâches. Tokens uniquement. */
    .page-body > section + section { margin-top: 22px; }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

    /* Le mot de CYL : une carte sobre, pas un bandeau lumineux. */
    .cyl-note { display:flex; gap:12px; align-items:flex-start; }
    .cyl-note .ic { color:var(--leaf-text); margin-top:2px; }
    .cyl-note .t-eyebrow { margin-bottom:3px; }
    .cyl-line { font-size:.92rem; color:var(--text-1); line-height:1.5; }

    /* Rythme */
    .rhythm-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:14px; }
    .rhythm-grid .wide { grid-column:1 / -1; }
    .pick.energy > button { flex:1; font-size:1.1rem; }
    .rhythm-save-row { display:flex; justify-content:flex-end; margin-top:16px; }

    /* Base vitale : quatre gestes, quatre boutons de 44 px et plus. */
    .vitals-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:12px; }
    .vital-card { display:flex; flex-direction:column; align-items:center; gap:8px; padding:16px 10px; min-height:44px;
      border-radius:var(--r); background:var(--surface-1); border:1px solid var(--line); color:var(--text-1);
      font:inherit; cursor:pointer; position:relative; transition:background var(--duration), border-color var(--duration); }
    .vital-card:hover { background:var(--surface-2); }
    .vital-card .ic { color:var(--text-2); }
    .vital-card .ic svg { width:26px; height:26px; }
    .vital-card.done { background:rgba(132,194,94,.12); border-color:rgba(132,194,94,.4); }
    .vital-card.done .ic { color:var(--leaf-text); }
    .vital-name { font-size:.8rem; font-weight:600; }
    .vital-check { position:absolute; top:8px; right:8px; width:20px; height:20px; border-radius:50%;
      border:1.5px solid var(--line-strong); display:grid; place-items:center; color:transparent; }
    .vital-check svg { width:12px; height:12px; }
    .vital-card.done .vital-check { background:var(--leaf); border-color:var(--leaf); color:#08130a; }

    /* Tâches */
    .tasks-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
    .tasks-progress { font-size:.8rem; color:var(--text-3); }
    .task-list { display:flex; flex-direction:column; gap:8px; }
    .task-card { display:flex; align-items:center; gap:12px; padding:10px 12px 10px 14px; border-radius:var(--r-sm);
      background:var(--surface-1); border:1px solid var(--line); position:relative; overflow:hidden; }
    .task-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--bc, var(--line-strong)); }
    .task-card:hover { background:var(--surface-2); }
    .task-card.done { opacity:.6; }
    .task-card.done .task-title { text-decoration:line-through; }
    .task-check { width:44px; height:44px; flex-shrink:0; border:none; background:transparent; cursor:pointer;
      display:grid; place-items:center; color:var(--text-3); border-radius:50%; }
    .task-check span { width:26px; height:26px; border-radius:50%; border:1.5px solid var(--line-strong); display:grid; place-items:center; color:transparent; }
    .task-check span svg { width:14px; height:14px; }
    .task-check:hover span { border-color:var(--text-2); }
    .task-card.done .task-check span { background:var(--bc, var(--leaf)); border-color:var(--bc, var(--leaf)); color:#08130a; }
    .task-body { flex:1; min-width:0; }
    .task-title { font-size:.92rem; font-weight:600; color:var(--text-1); overflow-wrap:anywhere; }
    .task-branch { font-size:.74rem; font-weight:600; color:var(--bc, var(--text-3)); margin-top:2px; display:flex; align-items:center; gap:5px; }
    .task-branch svg { width:13px; height:13px; }
    .task-del { opacity:0; }
    .task-card:hover .task-del, .task-del:focus-visible { opacity:1; }

    .add-task-row { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
    .add-task-row .input { flex:1; min-width:160px; width:auto; }
    .add-task-row .select { width:auto; min-width:150px; }

    @media (max-width:640px) {
      .add-task-row .select { width:100%; }
      .task-del { opacity:1; }
    }
    .workload { margin:10px 0 0; font-size:.84rem; color:var(--gold-text); }
    .evening .evening-sum { margin:0 0 12px; font-size:.9rem; color:var(--text-2); }
    .evening-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .evening-done { margin:10px 0 0; font-size:.84rem; color:var(--leaf-text); }
  </style>
</head>
<body>
  <main class="page-shell" aria-labelledby="page-title">
    <header class="page-head">
      <div class="page-head-id">
        <h1 id="page-title"><span class="ic" data-icon="sun"></span>Aujourd'hui</h1>
        <p class="page-sub">Ton poste de pilotage, à ton rythme. <span id="header-date"></span></p>
      </div>
    </header>

    <div class="page-body">
      <!-- CYL : elle constate, elle propose -->
      <div class="card cyl-note">
        <span class="ic" data-icon="sparkles" aria-hidden="true"></span>
        <div>
          <div class="t-eyebrow">CYL</div>
          <div class="cyl-line" id="lya-line">Bonjour. Si tu veux, on commence par caler ton rythme du jour.</div>
        </div>
      </div>

      <!-- Rythme du jour -->
      <section aria-labelledby="sec-rythme">
        <div class="sec-label" id="sec-rythme">Ton rythme du jour</div>
        <div class="card">
          <div class="rhythm-grid">
            <div class="field">
              <label for="r-wake">Réveil</label>
              <input type="time" class="input" id="r-wake">
            </div>
            <div class="field">
              <label for="r-sleep">Sommeil (h)</label>
              <select class="select" id="r-sleep">
                <option value="">Choisir</option>
                <option>4</option><option>5</option><option>6</option><option>7</option>
                <option>8</option><option>9</option><option>10</option>
              </select>
            </div>
            <div class="field">
              <span class="field-label" id="energy-label">Énergie</span>
              <div class="pick energy" id="energy-chips" role="group" aria-labelledby="energy-label">
                <button type="button" class="energy-chip" data-v="1" aria-pressed="false" aria-label="Épuisé" title="Épuisé">😴</button>
                <button type="button" class="energy-chip" data-v="2" aria-pressed="false" aria-label="Bas" title="Bas">🙁</button>
                <button type="button" class="energy-chip" data-v="3" aria-pressed="false" aria-label="Moyen" title="Moyen">😐</button>
                <button type="button" class="energy-chip" data-v="4" aria-pressed="false" aria-label="Bien" title="Bien">🙂</button>
                <button type="button" class="energy-chip" data-v="5" aria-pressed="false" aria-label="En feu" title="En feu">🤩</button>
              </div>
            </div>
            <div class="field">
              <label for="r-time">Temps disponible</label>
              <select class="select" id="r-time">
                <option value="">Choisir</option>
                <option value="1">Moins d'1 h</option>
                <option value="3">1 à 3 h</option>
                <option value="6">3 à 6 h</option>
                <option value="9">6 h et +</option>
              </select>
            </div>
            <div class="field wide">
              <label for="r-focus">Focus du jour</label>
              <input type="text" class="input" id="r-focus" maxlength="80" placeholder="La chose la plus importante aujourd'hui…">
            </div>
          </div>
          <div class="rhythm-save-row">
            <button class="btn primary" type="button" id="btn-save-rhythm"><span class="ic" data-icon="check"></span>Enregistrer mon rythme</button>
          </div>
        </div>
      </section>

      <!-- Base vitale -->
      <section aria-labelledby="sec-vitals">
        <div class="sec-label" id="sec-vitals">Tes besoins essentiels, la base</div>
        <div class="vitals-grid" id="vitals-grid"></div>
      </section>

      <!-- Tâches du jour -->
      <section aria-labelledby="sec-tasks">
        <div class="sec-label" id="sec-tasks">Tes tâches du jour</div>
        <div class="card">
          <div class="tasks-head">
            <span class="tasks-progress" id="tasks-progress"></span>
          </div>
          <div class="task-list" id="task-list"></div>
          <p class="workload" id="workload-note" hidden></p>
          <div class="add-task-row">
            <label class="sr-only" for="task-title">Nouvelle tâche</label>
            <input type="text" class="input" id="task-title" maxlength="100" placeholder="Ajouter une tâche…">
            <label class="sr-only" for="task-branch">Branche nourrie</label>
            <select class="select" id="task-branch"></select>
            <label class="sr-only" for="task-skill">Compétence (optionnel)</label>
            <select class="select" id="task-skill" title="Compétence (optionnel)"></select>
            <button class="btn" type="button" id="btn-add-task"><span class="ic" data-icon="plus"></span>Ajouter</button>
          </div>
        </div>
      </section>
      <!-- Clôture du soir (Sunsama « shutdown », Stoic « evening ») : on relit,
           on reporte ce qui reste sans le juger, on pose une phrase. -->
      <section aria-labelledby="sec-soir" id="evening-section">
        <div class="sec-label" id="sec-soir">Clôture du soir</div>
        <div class="card evening">
          <p class="evening-sum" id="evening-sum"></p>
          <div class="field">
            <label for="evening-note">Une phrase pour finir la journée</label>
            <textarea class="textarea" id="evening-note" rows="2" maxlength="280" placeholder="Ce qui reste de cette journée, en une phrase…"></textarea>
          </div>
          <div class="evening-actions">
            <button class="btn" type="button" id="btn-carry"><span class="ic" data-icon="arrowRight"></span>Reporter ce qui reste à demain</button>
            <button class="btn primary" type="button" id="btn-close-day"><span class="ic" data-icon="moon"></span>Clôturer la journée</button>
          </div>
          <p class="evening-done" id="evening-done" hidden></p>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="/js/plan.js"></script>
</body>
</html>
