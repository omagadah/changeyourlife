<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <script src="/js/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Compétences - Change Your Life</title>
  <meta name="description" content="Tes savoir-faire qui grandissent avec le temps : chaque tâche accomplie fait monter une compétence. Vois-toi progresser, pour de vrai.">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0a0f0a">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/main.min.css"/>
  <link rel="stylesheet" href="/css/transitions.css"/>
  <style>
    /* Compétences : des savoir-faire qui montent de niveau. Tokens uniquement. */
    .page-body > section + section { margin-top:22px; }

    .cyl-note { display:flex; gap:12px; align-items:flex-start; margin-bottom:22px; }
    .cyl-note .ic { color:var(--leaf-text); margin-top:2px; }
    .cyl-note .t-eyebrow { margin-bottom:3px; }
    .cyl-line { font-size:.92rem; color:var(--text-1); line-height:1.5; }

    .add-row { display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; }
    .add-row .field { flex:1; min-width:170px; }
    .add-row .field.narrow { flex:0 0 auto; min-width:0; }
    .add-row .select { width:auto; min-width:120px; }

    .skill-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:14px; }
    .skill-card { position:relative; overflow:hidden; }
    .skill-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--bc, var(--line-strong)); }
    .sk-top { display:flex; align-items:center; gap:11px; }
    /* L'emoji est celui que la personne a choisi pour sa compétence : il reste. */
    .sk-emoji { font-size:1.7rem; }
    .sk-id { flex:1; min-width:0; }
    .sk-name { font-family:var(--font-display); font-size:1.05rem; font-weight:600; color:var(--text-1); }
    .sk-branch { font-size:.74rem; font-weight:600; color:var(--bc, var(--text-3)); margin-top:1px; }
    .sk-del { opacity:0; }
    .skill-card:hover .sk-del, .sk-del:focus-visible { opacity:1; }
    .sk-lvl { display:flex; align-items:baseline; justify-content:space-between; margin:13px 0 6px; }
    .sk-lvl-name { font-size:.84rem; font-weight:700; color:var(--bc, var(--text-2)); }
    .sk-lvl-xp { font-size:.74rem; color:var(--text-3); font-variant-numeric:tabular-nums; }
    .sk-bar-bg { height:6px; background:var(--surface-3); border-radius:6px; overflow:hidden; }
    .sk-bar { height:100%; background:var(--bc, var(--leaf)); border-radius:6px; width:0%; transition:width .8s var(--ease); }
    .sk-foot { display:flex; align-items:center; justify-content:space-between; margin-top:13px; gap:8px; }
    .sk-last { font-size:.74rem; color:var(--text-3); }

    .suggest { display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
    .sug-chip { cursor:pointer; font:inherit; min-height:36px; }

    @media (max-width:640px) {
      .add-row .field, .add-row .field.narrow { flex:1 1 100%; }
      .add-row .select { width:100%; }
      .sk-del { opacity:1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sk-bar { transition:none; }
    }
  </style>
</head>
<body>
  <main class="page-shell" aria-labelledby="page-title">
    <header class="page-head">
      <div class="page-head-id">
        <h1 id="page-title"><span class="ic" data-icon="mountain"></span>Compétences</h1>
        <p class="page-sub">Ce que tu maîtrises grandit avec le temps : chaque pratique compte.</p>
      </div>
    </header>

    <div class="page-body">
      <div class="card cyl-note">
        <span class="ic" data-icon="sparkles" aria-hidden="true"></span>
        <div>
          <div class="t-eyebrow">CYL</div>
          <div class="cyl-line" id="lya-line">Tu peux ajouter ici les savoir-faire qui comptent pour toi. À chaque pratique, ils montent, et tes progrès s'accumulent sous tes yeux.</div>
        </div>
      </div>

      <section aria-labelledby="sec-add">
        <div class="sec-label" id="sec-add">Ajouter une compétence</div>
        <div class="card">
          <div class="add-row">
            <div class="field">
              <label for="sk-name">Nom</label>
              <input type="text" class="input" id="sk-name" maxlength="40" placeholder="Ex : Cuisine, Informatique, Guitare…">
            </div>
            <div class="field narrow">
              <label for="sk-emoji">Emoji</label>
              <select class="select" id="sk-emoji"></select>
            </div>
            <div class="field narrow">
              <label for="sk-branch">Branche</label>
              <select class="select" id="sk-branch"></select>
            </div>
            <button class="btn primary" type="button" id="btn-add"><span class="ic" data-icon="plus"></span>Ajouter</button>
          </div>
        </div>
      </section>

      <section aria-labelledby="sec-list">
        <div class="sec-label" id="sec-list">Tes compétences</div>
        <div id="skills-host"></div>
      </section>
    </div>
  </main>

  <script type="module" src="/js/competences.js"></script>
</body>
</html>
